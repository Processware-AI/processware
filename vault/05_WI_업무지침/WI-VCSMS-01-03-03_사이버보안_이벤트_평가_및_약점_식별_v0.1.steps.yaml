wi_id:           "WI-VCSMS-01-03-03"
title:           "사이버보안 이벤트 평가 및 약점 식별"
version:         "0.1"
parent_pro:      "PRO-VCSMS-01-03"
parent_pol:      "POL-VCSMS-01"
related_tmp:
  - "TMP-VCSMS-01-03-03-01"
scope_code:      "VCSMS"
scope_type:      "common"
standards:       ["ISO/SAE 21434"]

extracted_at:    "2026-06-14T00:00:00Z"
extractor:       "wi-tmp-writer"
extractor_model: "claude-opus-4-8"
manual_override: false

steps:
  - id:           "step-01"
    name:         "이벤트 컨텍스트 분석"
    section_ref:  "§5.2.1"
    inputs:
      - field:    "event_context"
        type:     "text"
        question: "이벤트가 가리키는 결함·악용 기법·영향 범위는?"
        required: true
    outputs:
      - tmp_field: "식별서.컨텍스트"
        from:      "event_context"
    hitl: false
  - id:           "step-02"
    name:         "약점 식별"
    section_ref:  "§5.2.2"
    description:  "item/component 약점 식별 ([RQ-08-04])"
    inputs:
      - field:    "weakness_list"
        type:     "table"
        question: "식별한 약점을 입력하세요(위치·성격·관련 자산)."
        required: true
        columns:  ["약점ID", "위치", "성격", "관련자산"]
    outputs:
      - tmp_field: "식별서.약점[]"
        from:      "weakness_list"
    hitl: false
  - id:           "step-03"
    name:         "기존 분석 대조"
    section_ref:  "§5.2.3"
    inputs:
      - field:    "tara_crosscheck"
        type:     "text"
        question: "기존 TARA·케이스 대조 결과(신규성·기존 통제 적용)는?"
        required: true
    outputs:
      - tmp_field: "식별서.대조"
        from:      "tara_crosscheck"
    hitl: false
  - id:           "step-04"
    name:         "영향 잠정 평가"
    section_ref:  "§5.2.4"
    inputs:
      - field:    "impact_prelim"
        type:     "table"
        question: "약점별 잠정 영향(S/F/O/P)·우선순위를 입력하세요."
        required: true
        columns:  ["약점ID", "잠정영향범주", "우선순위"]
    outputs:
      - tmp_field: "식별서.잠정영향[]"
        from:      "impact_prelim"
    hitl: false
  - id:           "step-05"
    name:         "CSM 검토·승인"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "approval_decision"
        type:     "enum"
        question: "CSM 약점 식별 완전성 승인 결정은?"
        required: true
        options:  ["승인", "보완 후 승인", "재평가"]
    outputs:
      - tmp_field: "결재.승인"
        from:      "approval_decision"
    hitl: required
    approver_role: "Cybersecurity Manager (CSM)"
    rationale:     "WI §2 승인자 = CSM (약점 식별 완전성 검토)"
  - id:           "step-06"
    name:         "연계"
    section_ref:  "§5.2.6"
    inputs:
      - field:    "handoff"
        type:     "text"
        question: "약점 분석(WI-01-03-04) 연계 결과는?"
        required: true
    outputs:
      - tmp_field: "식별서.연계"
        from:      "handoff"
    hitl: false

dod_checklist:
  - "이벤트 컨텍스트(결함·기법·영향 범위) 분석·자산 매핑 완료"
  - "약점별 위치·성격·관련 자산 기술"
  - "기존 TARA·케이스 대조(신규성·기존 통제 적용 여부)"
  - "약점 실현 시 잠정 영향 약식 평가·우선순위화"
  - "CSM 약점 식별 완전성 검토·승인"
  - "약점 분석(WI-01-03-04) 연계 완료"

exception_hooks:
  - section: "§7.1"
    name:    "설계 정보 부족(공급사)"
    rule:    "OTS·공급사 정보 부족 시 CIA·§7 연계 정보 요청, 가용 한도 내 보수적 식별·잔존 불확실성 기록"
  - section: "§7.2"
    name:    "다수 약점·연쇄 영향"
    rule:    "다수 약점·연쇄 시 개별 식별하되 체인 관계 기록, 분석 단계에서 종합 평가"
  - section: "§7.3"
    name:    "긴급 약점(악용 가능)"
    rule:    "운영 중 즉시 악용 가능 시 분석 완료 전 사고대응(PRO-01-04)·즉시 처리 병행 가동"

triggers:        ["이벤트 평가", "약점 식별", "weakness 분석", "취약점 전 단계 평가"]
aliases:         ["event assessment", "weakness identification", "약점 평가"]
event_triggers:  ["이벤트 확정 완료", "신규 취약점 권고 영향 자산 매칭"]
domains:         ["자동차"]
