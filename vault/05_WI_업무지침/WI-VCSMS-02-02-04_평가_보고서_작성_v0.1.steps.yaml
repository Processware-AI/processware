wi_id:           "WI-VCSMS-02-02-04"
title:           "평가 보고서 작성"
version:         "0.1"
parent_pro:      "PRO-VCSMS-02-02"
parent_pol:      "POL-VCSMS-02"
related_tmp:
  - "TMP-VCSMS-02-02-04-01"
scope_code:      "VCSMS"
scope_type:      "project"
standards:       ["ISO/SAE 21434"]

extracted_at:    "2026-06-14T00:00:00Z"
extractor:       "wi-tmp-writer"
extractor_model: "claude-opus-4-7"
manual_override: false

steps:
  - id:           "step-01"
    name:         "발견사항 종합"
    section_ref:  "§5.2.1"
    inputs:
      - field:    "findings_summary"
        type:     "table"
        question: "체크리스트의 부적합·조건부 항목을 우선순위와 함께 정리하라"
        columns:  ["발견사항", "심각도", "관련 WP", "우선순위"]
        required: true
    outputs:
      - tmp_field: "보고서.발견사항[]"
        from:      "findings_summary"
    hitl: false

  - id:           "step-02"
    name:         "권고 결정"
    section_ref:  "§5.2.2"
    inputs:
      - field:    "has_critical_nonconformity"
        type:     "boolean"
        question: "릴리스를 막는 중대 부적합이 있는가?"
        required: true
      - field:    "all_closable"
        type:     "boolean"
        question: "잔여 항목이 조건으로 닫을 수 있는가?"
        required: true
    derivations:
      - id:       "recommendation"
        expr:     |
          if has_critical_nonconformity: "거부"
          elif not all_closable: "거부"
          elif 잔여 발견사항 존재: "조건부 수용"
          else: "수용"
        description: "권고 자동 도출"
    outputs:
      - tmp_field: "보고서.권고"
        from:      "recommendation"
    hitl: false

  - id:           "step-03"
    name:         "수용 조건 명시"
    section_ref:  "§5.2.3"
    inputs:
      - field:    "acceptance_conditions"
        type:     "table"
        question: "(조건부 시) 수용 조건·검증 방법·기한을 명시하라"
        columns:  ["수용 조건", "검증 방법", "기한"]
        required: false
        required_if: "recommendation == '조건부 수용'"
    outputs:
      - tmp_field: "보고서.조건[]"
        from:      "acceptance_conditions"
    hitl: false

  - id:           "step-04"
    name:         "확정·전달"
    section_ref:  "§5.2.4"
    inputs:
      - field:    "assessor_name"
        type:     "person"
        question: "보고서 확정 Assessor 는?"
        required: true
    outputs:
      - tmp_field: "보고서.서명"
        from:      "assessor_name"
    hitl: required
    approver_role: "Assessor(독립)"
    rationale:     "WI §2 승인자 — 평가 권고의 독립적 책임"

dod_checklist:
  - "발견사항(부적합·조건부) 종합·우선순위화"
  - "수용/조건부/거부 권고 결정"
  - "(조건부 시) 수용 조건·검증 방법·기한 명시"
  - "Assessor 서명·확정"
  - "CSM·릴리스 결정권자 전달"

exception_hooks:
  - section: "§7.1"
    name:    "조건 모호"
    rule:    "조건이 검증 불가/모호 시 측정 가능 형태로 재작성. 모호 조건으로 릴리스 게이트 통과 금지."
  - section: "§7.2"
    name:    "거부 후 재평가"
    rule:    "거부 후 보완 완료 시 변경 케이스로 재평가(WI-03)·신규 보고서. 이전 거부 보고서 보존."
  - section: "§7.3"
    name:    "권고-결정 이견"
    rule:    "결정권자가 거부/조건부 권고 무시 시 경영진 명시 승인·근거 기록 필수. Assessor 독립 의견 원형 보존."

triggers:        ["평가 보고서", "수용 권고", "조건부 수용", "거부 권고", "assessment report"]
aliases:         ["assessment report", "평가보고", "권고서"]
event_triggers:  ["독립 평가 완료 후"]
domains:         ["자동차"]
