wi_id:           "WI-VCSMS-02-04-05"
title:           "사이버보안 컨셉·통제·요구사항 정의 및 할당"
version:         "0.1"
parent_pro:      "PRO-VCSMS-02-04"
parent_pol:      "POL-VCSMS-02"
related_tmp:
  - "TMP-VCSMS-02-04-05-01"
scope_code:      "VCSMS"
scope_type:      "project"
standards:       ["ISO/SAE 21434"]

extracted_at:    "2026-06-14T00:00:00Z"
extractor:       "wi-tmp-writer"
extractor_model: "claude-opus-4-7"
manual_override: false

steps:
  - id:          "step-01"
    name:        "통제·상호작용 기술"
    section_ref: "§5.2.1"
    inputs:
      - field:    "controls"
        type:     "table"
        question: "각 목표 달성을 위한 기술·운영 통제와 상호작용을 입력하세요."
        columns:  ["goal_id", "control", "interaction_dependency"]
        required: true
    outputs:
      - tmp_field: "명세서.통제목록"
        from:      "controls"
    hitl: false

  - id:          "step-02"
    name:        "사이버보안 요구 정의"
    section_ref: "§5.2.2"
    inputs:
      - field:    "requirements"
        type:     "table"
        question: "목표별 아이템·운용환경 사이버보안 요구를 입력하세요."
        columns:  ["req_id", "goal_id", "requirement_statement"]
        required: true
    outputs:
      - tmp_field: "명세서.요구목록"
        from:      "requirements"
    hitl: false

  - id:          "step-03"
    name:        "요구 할당"
    section_ref: "§5.2.3"
    inputs:
      - field:    "allocations"
        type:     "table"
        question: "각 요구를 아이템·컴포넌트·외부주체에 할당하세요."
        columns:  ["req_id", "allocated_to", "type"]
        required: true
    derivations:
      - id:       "all_allocated"
        expr:     |
          if every req_id has allocated_to: "OK"
          else: "미할당"
        description: "모든 요구 할당 완료 시 OK"
    outputs:
      - tmp_field: "명세서.할당"
        from:      "allocations"
    hitl: false

  - id:          "step-04"
    name:        "추적성 연결"
    section_ref: "§5.2.4"
    inputs:
      - field:    "trace_chain_ok"
        type:     "boolean"
        question: "위협→목표→통제→요구→할당 추적 사슬이 연결되었습니까?"
        required: true
    outputs:
      - tmp_field: "명세서.추적사슬"
        from:      "trace_chain_ok"
    hitl: false

  - id:          "step-05"
    name:        "검토·승인"
    section_ref: "§5.2.5"
    inputs:
      - field:    "approval_decision"
        type:     "enum"
        question: "CSM 승인 결정은 무엇입니까?"
        options:  ["승인", "조건부승인", "반려"]
        required: true
    outputs:
      - tmp_field: "명세서.결재.승인"
        from:      "approval_decision"
    hitl: required
    approver_role: "Cybersecurity Manager (CSM)"
    rationale:     "WI §2 승인자 = CSM"

dod_checklist:
  - "entry_gate(WI-04-04 done) 충족 확인"
  - "모든 목표에 통제·상호작용 기술(누락 0)"
  - "모든 목표에 사이버보안 요구(CR-##) 정의(누락 0)"
  - "모든 요구가 아이템·컴포넌트·외부주체에 할당(미할당 0)"
  - "목표↔통제↔요구↔할당 추적 사슬 연결 확인"
  - "CSM 승인 기록 확보"

exception_hooks:
  - section: "§7.1"
    name:    "목표 미충족 통제 공백"
    rule:    "달성 통제 미식별 시 컨셉 미완 표기, 목표 재검토(WI-04-04) 또는 추가 통제 연구 CSM 보고"
  - section: "§7.2"
    name:    "운용환경 요구 책임 불명"
    rule:    "임의 할당 금지, Clause 7 CIA 또는 운영팀 협의로 책임 확정 후 할당"
  - section: "§7.3"
    name:    "통제 간 상충"
    rule:    "우선순위·트레이드오프 명시, CSM 결정으로 조정"

triggers:        ["사이버보안 컨셉", "사이버보안 요구", "요구 할당", "통제 정의", "cybersecurity concept"]
aliases:         ["security concept", "requirement allocation", "통제 할당", "요구사항 정의"]
event_triggers:  ["목표·클레임 검증 통과", "컨셉 정의 착수"]
domains:         ["자동차"]
