    rule:    "가이드라인·정적분석·런타임 보호로 보완, 잔존 제약을 약점 분석(WI-05-03) 입력 등록"
  - section: "§7.2"
    name:    "권고 원칙 미적용"
    rule:    "[RC-10-06] 미적용 시 근거 적용 확인서 명시"
  - section: "§7.3"
    name:    "가이드라인 위반 미시정"
    rule:    "잔존 위반을 약점 등록, 약점 분석·검증(WI-05-03,06)에서 처리"

