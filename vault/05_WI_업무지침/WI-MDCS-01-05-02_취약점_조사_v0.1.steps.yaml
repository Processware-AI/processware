steps:
  - id:           "step-01"
    name:         "적용성·검증가능성 판정"
    section_ref:  "§5.2.1-5.2.2"
    inputs:
      - field:    "report_id"
        type:     "text"
        question: "조사 대상 접수 ID 는?"
        required: true
      - field:    "applicability"
        type:     "enum"
        question: "제품 적용성 판정은?"
        options:  ["적용(존재)", "비적용(미존재)"]
        required: true
      - field:    "verifiability"
        type:     "enum"
        question: "검증 가능성은?"
        options:  ["재현 가능", "재현 불가", "재현 미시도"]
        required: true
    outputs:
      - tmp_field: "조사.적용성"
        from:      "applicability"
      - tmp_field: "조사.검증가능성"
        from:      "verifiability"
    hitl: false
  - id:           "step-02"
    name:         "관련 위협 식별·연계 결정"
    section_ref:  "§5.2.3-5.2.4"
    inputs:
      - field:    "threats"
        type:     "text"
        question: "관련 위협(공격 시나리오·자산)은?"
        required: false
      - field:    "next_action"
        type:     "enum"
        question: "후속 조치는?"
        options:  ["분석 연계", "종결(비적용)"]
        required: true
    outputs:
      - tmp_field: "조사.위협"
        from:      "threats"
      - tmp_field: "조사.연계"
        from:      "next_action"
    hitl: false
  - id:           "step-03"
    name:         "검토·기록"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "approval"
        type:     "enum"
        question: "PSO 검토 결과는?"
        options:  ["승인", "보완요청"]
        required: true
    outputs:
      - tmp_field: "결재.검토"
        from:      "approval"
    hitl: required
    approver_role: "보안책임자(PSO)"
    rationale:    "WI §2 승인자 = PSO. 조사 충분성·SLA 준수 검토"

