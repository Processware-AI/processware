  - section: "§7.2"
    name:    "긴급 정보공유"
    rule:    "사고·중대 취약점 시 사전 정의된 긴급 채널 가동(PRO-01-03/04 연계), 사후 이력 기록"
  - section: "§7.3"
    name:    "외부 당사자 정보보안 미정렬"
    rule:    "외부 보호 수준 미충족 시 공유 범위 축소·추가 보호조치 조건화, 미정렬 리스크 CSM 보고"

