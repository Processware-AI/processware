steps:
  - id:           "step-01"
    name:         "Clause 4 활동 구현"
    section_ref:  "§5.2.1"
    inputs:
      - field:    "product_name"
        type:     "text"
        question: "대상 전환SW 명칭/버전은?"
        required: true
      - field:    "clause4_impl"
        type:     "table"
        question: "Clause 4 활동 구현 현황을 기재하세요."
        columns:  ["Clause 4 활동", "구현 여부", "참조 산출물"]
        required: true
    outputs:
      - tmp_field: "Clause4[]"
        from:      "clause4_impl"
    hitl: false
  - id:           "step-02"
    name:         "산출물 대비 갭 분석"
    section_ref:  "§5.2.2-5.2.3"
    inputs:
      - field:    "gap_analysis"
        type:     "table"
        question: "대상 조항 산출물 대비 갭을 기재하세요."
        columns:  ["조항(§5.2/§5.7/§7.1.1/§7.2/§7.3)", "충족 상태(충족/부분/미충족)", "갭 내용", "영향"]
        required: true
    outputs:
      - tmp_field: "갭분석[]"
        from:      "gap_analysis"
    hitl: false
  - id:           "step-03"
    name:         "검토·연계"
    section_ref:  "§5.2.4"
    inputs:
      - field:    "approval"
        type:     "enum"
        question: "PSO 검토 결과는?"
        options:  ["승인(갭 종결 연계)", "보완요청"]
        required: true
    outputs:
      - tmp_field: "결재.검토"
        from:      "approval"
    hitl: required
    approver_role: "보안책임자(PSO)"
    rationale:    "WI §2 승인자 = PSO, PRO §3 RACI Clause4 구현·갭분석 A=PSO"

