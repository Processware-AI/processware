steps:
  - id:           "step-01"
    name:         "계속 사용 정당화·비업그레이드 정당성"
    section_ref:  "§5.2.1-5.2.2"
    inputs:
      - field:    "target_version"
        type:     "text"
        question: "정당화 대상 버전은?"
        required: true
      - field:    "justification"
        type:     "text"
        question: "계속 사용 정당화 근거(잔여 리스크 기반)는?"
        required: true
      - field:    "non_upgrade"
        type:     "table"
        question: "비업그레이드 컴포넌트 정당성을 기재하세요."
        columns:  ["컴포넌트", "비업그레이드 사유", "리스크"]
        required: false
    outputs:
      - tmp_field: "정당화.근거"
        from:      "justification"
      - tmp_field: "비업그레이드[]"
        from:      "non_upgrade"
    hitl: false
  - id:           "step-02"
    name:         "잔여 리스크 전달·전환 계획"
    section_ref:  "§5.2.3-5.2.4"
    inputs:
      - field:    "residual_disclosure"
        type:     "boolean"
        question: "릴리스 문서·동반문서에 잔여 리스크를 전달했습니까?"
        required: true
      - field:    "transition_plan"
        type:     "table"
        question: "완전 적합(Clause 6~9) 전환 계획을 기재하세요."
        columns:  ["전환 항목(Clause)", "마일스톤", "목표 일자"]
        required: true
    outputs:
      - tmp_field: "전환계획[]"
        from:      "transition_plan"
    hitl: false
  - id:           "step-03"
    name:         "검토·승인"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "approval"
        type:     "enum"
        question: "PSGB 승인 결과는?"
        options:  ["승인", "사용 중지/대체 결정", "보완요청"]
        required: true
    outputs:
      - tmp_field: "결재.승인"
        from:      "approval"
    hitl: required
    approver_role: "보안운영위원회(PSGB)"
    rationale:    "WI §2 승인자 = PSGB, PRO §3 RACI 정당화·전환 계획 A=PSGB"

