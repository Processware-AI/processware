wi_id:           "WI-MDCS-01-02-03"
title:           "보안 아키텍처 명세 및 방어심층화 검토"
version:         "0.1"
parent_pro:      "PRO-MDCS-01-02"
parent_pol:      "POL-MDCS-01"
related_tmp:
  - "TMP-MDCS-01-02-03-01"
scope_code:      "MDCS"
scope_type:      "project"
standards:       ["IEC 81001-5-1"]
