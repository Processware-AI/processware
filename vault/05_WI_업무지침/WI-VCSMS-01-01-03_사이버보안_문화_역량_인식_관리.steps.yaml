wi_id:           "WI-VCSMS-01-01-03"
title:           "사이버보안 문화·역량·인식 관리"
version:         "0.1"
parent_pro:      "PRO-VCSMS-01-01"
parent_pol:      "POL-VCSMS-01"
related_tmp:
  - "TMP-VCSMS-01-01-03-01"
scope_code:      "VCSMS"
scope_type:      "common"
standards:       ["ISO/SAE 21434"]

extracted_at:    "2026-06-14T00:00:00Z"
extractor:       "wi-tmp-writer"
extractor_model: "claude-opus-4-8"
manual_override: false

steps:
  - id:           "step-01"
    name:         "요구 역량 정의"
    section_ref:  "§5.2.1"
    description:  "역할별 요구 역량 항목·수준·검증방법 정의 ([RQ-05-07])"
    inputs:
      - field:    "competence_profile"
        type:     "table"
        question: "역할별 요구 역량 항목·수준·검증방법을 입력하세요."
        required: true
        columns:  ["역할", "역량항목", "요구수준", "검증방법"]
    outputs:
      - tmp_field: "관리대장.요구역량[]"
        from:      "competence_profile"
    hitl: false
  - id:           "step-02"
    name:         "역량 평가·격차 식별"
    section_ref:  "§5.2.2"
    inputs:
      - field:    "gap_table"
        type:     "table"
        question: "담당자별 현재 역량과 격차를 입력하세요."
        required: true
        columns:  ["담당자", "역량항목", "요구수준", "현재수준", "격차"]
    outputs:
      - tmp_field: "관리대장.격차[]"
        from:      "gap_table"
    hitl: false
  - id:           "step-03"
    name:         "역량 보완 계획·이행"
    section_ref:  "§5.2.3"
    inputs:
      - field:    "remediation_plan"
        type:     "table"
        question: "격차별 보완 수단·일정·이수결과를 입력하세요."
        required: true
        columns:  ["담당자", "보완수단", "일정", "이수일", "평가결과"]
    outputs:
      - tmp_field: "관리대장.보완[]"
        from:      "remediation_plan"
    hitl: false
  - id:           "step-04"
    name:         "문화·인식 활동"
    section_ref:  "§5.2.4"
    description:  "전사 인식 캠페인·교육·사례 공유 ([RQ-05-06])"
    inputs:
      - field:    "awareness_activities"
        type:     "table"
        question: "인식 활동 계획·시행 기록을 입력하세요."
        required: true
        columns:  ["활동명", "대상", "시행일", "참여율"]
    outputs:
      - tmp_field: "관리대장.인식활동[]"
        from:      "awareness_activities"
    hitl: false
  - id:           "step-05"
    name:         "충족률 점검·보고"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "competence_met_count"
        type:     "number"
        question: "역량 충족 담당자 수는?"
        required: true
      - field:    "total_role_count"
        type:     "number"
        question: "사이버보안 역할 담당자 총 수는?"
        required: true
    derivations:
      - id:       "competence_rate"
        expr:     "round(competence_met_count / total_role_count * 100, 1)"
        description: "역량 충족률(%) — 목표 100"
    outputs:
      - tmp_field: "관리대장.충족률"
        from:      "competence_rate"
    hitl: false
  - id:           "step-06"
    name:         "등록"
    section_ref:  "§5.2.6"
    inputs:
      - field:    "mat_register"
        type:     "text"
        question: "MAT-001 등록·갱신 결과는?"
        required: true
    outputs:
      - tmp_field: "등록.MAT"
        from:      "mat_register"
    hitl: false

dod_checklist:
  - "사이버보안 역할별 요구 역량 항목·수준·검증방법 정의 완료"
  - "담당자별 역량 격차 식별 및 관리대장 기록 완료"
  - "식별된 격차에 대한 보완 계획 수립·일정화"
  - "전사 인식 활동(캠페인/교육) 계획·시행 기록 확보"
  - "역량 충족률 산정(목표 100%) 및 미충족 조치 상태 명시"
  - "PCB·경영진 반기 보고 및 MAT-001 등록 완료"

exception_hooks:
  - section: "§7.1"
    name:    "역량 격차 미해소"
    rule:    "보완 기간 내 격차 미해소 시 담당자를 critical 활동에서 임시 배제·재배정, 잔존 리스크 PCB 보고"
  - section: "§7.2"
    name:    "상위 §7.2 중복"
    rule:    "상위 HR 역량 시스템 존재 시 사이버보안 특화 항목만 추가, 일반 행정은 참조"
  - section: "§7.3"
    name:    "인식 활동 형식화"
    rule:    "이수율만 채우는 형식화 우려 시 사후 인식도 점검(설문·시뮬레이션)으로 실효성 검증"

triggers:        ["사이버보안 역량 관리", "보안 인식 교육", "역량 평가", "사이버보안 문화"]
aliases:         ["competence management", "security awareness", "역량 격차", "교육 훈련"]
event_triggers:  ["책임배정 완료", "반기 역량 점검 주기", "신규 담당자 배정"]
domains:         ["자동차"]
