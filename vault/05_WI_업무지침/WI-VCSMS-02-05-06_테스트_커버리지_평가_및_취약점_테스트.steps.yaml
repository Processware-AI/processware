wi_id:           "WI-VCSMS-02-05-06"
title:           "테스트 커버리지 평가 및 취약점 테스트"
version:         "0.1"
parent_pro:      "PRO-VCSMS-02-05"
parent_pol:      "POL-VCSMS-02"
related_tmp:
  - "TMP-VCSMS-02-05-06-01"
scope_code:      "VCSMS"
scope_type:      "project"
standards:       ["ISO/SAE 21434"]

extracted_at:    "2026-06-14T00:00:00Z"
extractor:       "wi-tmp-writer"
extractor_model: "claude-opus-4-7"
manual_override: false

steps:
  - id:          "step-01"
    name:        "커버리지 평가"
    section_ref: "§5.2.1"
    inputs:
      - field:    "coverage_metrics"
        type:     "table"
        question: "정의 커버리지 지표별 목표·달성도를 입력하세요."
        columns:  ["metric", "target", "achieved"]
        required: true
    derivations:
      - id:       "coverage_met"
        expr:     |
          if every metric achieved >= target: "충족"
          else: "미달"
        description: "전 지표 목표 충족 시 충족"
    outputs:
      - tmp_field: "결과서.커버리지"
        from:      "coverage_metrics"
    hitl: false

  - id:          "step-02"
    name:        "취약점 테스트 수행"
    section_ref: "§5.2.2"
    inputs:
      - field:    "vuln_test_performed"
        type:     "boolean"
        question: "취약점(침투·퍼징) 테스트를 수행했습니까?"
        required: true
      - field:    "vuln_test_results"
        type:     "table"
        question: "취약점 테스트 케이스와 결과를 입력하세요(WK-## 포함)."
        columns:  ["test_case", "target_weakness", "result"]
        required_if: "vuln_test_performed == true"
    outputs:
      - tmp_field: "결과서.취약점테스트"
        from:      "vuln_test_results"
    hitl: false

  - id:          "step-03"
    name:        "취약점 테스트 미수행 근거"
    section_ref: "§5.2.3"
    inputs:
      - field:    "non_test_rationale"
        type:     "text"
        question: "취약점 테스트 미수행 시 근거를 입력하세요([RQ-10-13])."
        required_if: "vuln_test_performed == false"
    outputs:
      - tmp_field: "결과서.미수행근거"
        from:      "non_test_rationale"
    hitl: false

  - id:          "step-04"
    name:        "결과 종합·잔존 처리"
    section_ref: "§5.2.4"
    inputs:
      - field:    "residual_treatments"
        type:     "table"
        question: "발견 취약점·미달 항목의 처리 방향을 입력하세요."
        columns:  ["item", "treatment"]
        required: false
    outputs:
      - tmp_field: "결과서.잔존처리"
        from:      "residual_treatments"
    hitl: false

  - id:          "step-05"
    name:        "검토·승인"
    section_ref: "§5.2.5"
    inputs:
      - field:    "approval_decision"
        type:     "enum"
        question: "CSM 승인 결정은 무엇입니까?"
        options:  ["승인", "조건부승인", "반려"]
        required: true
    outputs:
      - tmp_field: "결과서.결재.승인"
        from:      "approval_decision"
    hitl: required
    approver_role: "Cybersecurity Manager (CSM)"
    rationale:     "WI §2 승인자 = CSM (검증 활동 R/A 는 검증 엔지니어)"

dod_checklist:
  - "entry_gate(WI-05-05 done) 충족 확인"
  - "(테스트 채택 시)커버리지 지표 달성도 평가([RQ-10-11])"
  - "취약점 테스트 수행 또는 미수행 근거 제시([RC-10-12]/[RQ-10-13])"
  - "WK-## 테스트 검증 대상 약점 테스트 케이스 포함"
  - "발견 취약점·미달 항목 처리 방향 연결"
  - "CSM 승인 기록 확보"

exception_hooks:
  - section: "§7.1"
    name:    "커버리지 목표 미달"
    rule:    "추가 테스트 보완 또는 불가피 시 미달 근거·잔여 리스크 명시, CSM 수용"
  - section: "§7.2"
    name:    "취약점 테스트 미수행([RQ-10-13])"
    rule:    "미수행 시 근거 반드시 제시, 미근거 누락은 부적합"
  - section: "§7.3"
    name:    "신규 취약점 발견(중대)"
    rule:    "릴리스 보류, 약점/사양 재작업 또는 사고대응(PRO-VCSMS-01-04) 연계 여부 CSM 결정"

triggers:        ["테스트 커버리지", "취약점 테스트", "침투 테스트", "penetration test", "fuzzing"]
aliases:         ["test coverage", "pentest", "fuzzing", "취약점 테스트 근거", "커버리지 평가"]
event_triggers:  ["통합·검증 승인", "릴리스 전 테스트"]
domains:         ["자동차"]
