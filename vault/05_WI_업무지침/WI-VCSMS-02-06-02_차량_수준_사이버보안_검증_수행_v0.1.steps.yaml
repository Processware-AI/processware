steps:
  - id:          "step-01"
    name:        "목표 적정성 확인"
    section_ref: "§5.2.1"
    inputs:
      - field:    "goal_adequacy"
        type:     "table"
        question: "각 목표가 차량 통합 맥락에서 적정한지 확인 결과를 입력하세요."
        columns:  ["goal_id", "adequate", "finding"]
        required: true
    outputs:
      - tmp_field: "수행기록.목표적정성"
        from:      "goal_adequacy"
    hitl: false

  - id:          "step-02"
    name:        "목표 달성 확인"
    section_ref: "§5.2.2"
    inputs:
      - field:    "goal_achievement"
        type:     "table"
        question: "각 목표(CG)의 차량 수준 달성 여부와 증적을 입력하세요."
        columns:  ["goal_id", "achieved", "evidence"]
        required: true
    outputs:
      - tmp_field: "수행기록.목표달성"
        from:      "goal_achievement"
    hitl: false

  - id:          "step-03"
    name:        "클레임 유효성 확인"
    section_ref: "§5.2.3"
    inputs:
      - field:    "claim_validity"
        type:     "table"
        question: "각 클레임(CC)의 유효성 확인 결과를 입력하세요."
        columns:  ["claim_id", "valid", "finding"]
        required: false
    outputs:
      - tmp_field: "수행기록.클레임유효성"
        from:      "claim_validity"
    hitl: false

  - id:          "step-04"
    name:        "운용환경 요구 유효성 확인"
    section_ref: "§5.2.4"
    inputs:
      - field:    "env_validity"
        type:     "table"
        question: "운용환경 요구·가정의 실차 유효성 확인 결과를 입력하세요."
        columns:  ["env_req", "valid", "finding"]
        required: true
    outputs:
      - tmp_field: "수행기록.운용환경유효성"
        from:      "env_validity"
    hitl: false

  - id:          "step-05"
    name:        "부적합 식별·기록"
    section_ref: "§5.2.5"
    inputs:
      - field:    "nonconformities"
        type:     "table"
        question: "유효하지 않은 항목을 부적합으로 기록하고 처리 방향을 표식하세요."
        columns:  ["item", "treatment_direction"]
        required: false
    outputs:
      - tmp_field: "수행기록.부적합"
        from:      "nonconformities"
    hitl: false

  - id:          "step-06"
    name:        "검토·승인"
    section_ref: "§5.2.6"
    inputs:
      - field:    "approval_decision"
        type:     "enum"
        question: "CSM 승인 결정은 무엇입니까?"
        options:  ["승인", "조건부승인", "반려"]
        required: true
    outputs:
      - tmp_field: "수행기록.결재.승인"
        from:      "approval_decision"
    hitl: required
    approver_role: "Cybersecurity Manager (CSM)"
