steps:
  - id:           "step-01"
    name:         "정보원 선정"
    section_ref:  "§5.2.1"
    description:  "자산 커버리지 기준 정보원 선정 ([RQ-08-01])"
    inputs:
      - field:    "source_list"
        type:     "table"
        question: "정보원과 출처·신뢰도·갱신주기·수집방식을 입력하세요."
        required: true
        columns:  ["정보원", "출처", "신뢰도", "갱신주기", "수집방식"]
    outputs:
      - tmp_field: "정의서.정보원[]"
        from:      "source_list"
    hitl: false
  - id:           "step-02"
    name:         "수집 방식·자동화 정의"
    section_ref:  "§5.2.2"
    inputs:
      - field:    "collection_paths"
        type:     "table"
        question: "자동/수동 수집 경로와 책임자를 입력하세요."
        required: true
        columns:  ["경로", "유형", "책임자"]
    outputs:
      - tmp_field: "정의서.수집경로[]"
        from:      "collection_paths"
    hitl: false
  - id:           "step-03"
    name:         "트리아지 트리거 정의"
    section_ref:  "§5.2.3"
    description:  "이벤트 후보 분류 트리거·우선순위·SLA ([RQ-08-02])"
    inputs:
      - field:    "triage_triggers"
        type:     "table"
        question: "트리아지 트리거·우선순위·SLA 를 입력하세요."
        required: true
        columns:  ["트리거조건", "우선순위", "SLA"]
    outputs:
      - tmp_field: "정의서.트리거[]"
        from:      "triage_triggers"
    hitl: false
  - id:           "step-04"
    name:         "CSM 검토·승인"
    section_ref:  "§5.2.4"
    inputs:
      - field:    "approval_decision"
        type:     "enum"
        question: "CSM 커버리지·트리거 적정성 승인 결정은?"
        required: true
        options:  ["승인", "조건부승인", "반려"]
    outputs:
      - tmp_field: "결재.승인"
        from:      "approval_decision"
    hitl: required
    approver_role: "Cybersecurity Manager (CSM)"
    rationale:     "WI §2 승인자 = CSM (정보원 커버리지·트리거 적정성 승인)"
  - id:           "step-05"
    name:         "유지·갱신 주기 설정"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "update_policy"
        type:     "text"
        question: "정보원·트리거 정기 갱신 주기와 갱신 트리거는?"
        required: true
    outputs:
      - tmp_field: "정의서.갱신정책"
        from:      "update_policy"
    hitl: false
  - id:           "step-06"
    name:         "활성화·점검"
    section_ref:  "§5.2.6"
    inputs:
      - field:    "activation_rate"
        type:     "number"
        question: "선정 정보원 활성률(%)은?(목표 100)"
        required: true
        validation: "x == 100"
    outputs:
      - tmp_field: "정의서.활성률"
        from:      "activation_rate"
    hitl: false

dod_checklist:
