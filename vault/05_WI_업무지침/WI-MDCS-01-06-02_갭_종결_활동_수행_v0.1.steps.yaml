steps:
  - id:           "step-01"
    name:         "갭별 종결 활동 수행"
    section_ref:  "§5.2.1-5.2.5"
    inputs:
      - field:    "closure_activities"
        type:     "table"
        question: "각 갭의 종결 활동과 산출물을 기재하세요."
        columns:  ["갭(조항)", "종결 활동", "재사용 WI", "산출물", "종결 여부"]
        required: true
    outputs:
      - tmp_field: "종결활동[]"
        from:      "closure_activities"
    hitl: false
  - id:           "step-02"
    name:         "전체 잔여 리스크 평가"
    section_ref:  "§5.2.6"
    inputs:
      - field:    "residual_risk"
        type:     "table"
        question: "종결 후 전체 잔여 보안 리스크를 평가하세요."
        columns:  ["잔여 리스크", "수준", "보완 통제", "수용 여부"]
        required: true
    outputs:
      - tmp_field: "잔여리스크[]"
        from:      "residual_risk"
    hitl: false
  - id:           "step-03"
    name:         "검토·승인"
    section_ref:  "§5.2.7"
    inputs:
      - field:    "approval"
        type:     "enum"
        question: "PSO 검토 결과는?"
        options:  ["승인", "보완요청"]
        required: true
    outputs:
      - tmp_field: "결재.승인"
        from:      "approval"
    hitl: required
    approver_role: "보안책임자(PSO)"
    rationale:    "WI §2 승인자 = PSO, PRO §3 RACI 갭 종결 A=PSO"

