steps:
  - id:           "step-01"
    name:         "시험 계획·객관성 문서화"
    section_ref:  "§5.2 사전준비"
    inputs:
      - field:    "tester_objectivity"
        type:     "text"
        question: "테스터의 개발 독립성·객관성 확보 방안은?"
        required: true
      - field:    "test_matrix"
        type:     "table"
        question: "보안 요구·위협 완화별 시험 케이스 매핑을 기재하세요."
        columns:  ["요구/완화 ID", "시험 유형(기능/완화/취약점/침투)", "케이스 ID"]
        required: true
    outputs:
      - tmp_field: "객관성"
        from:      "tester_objectivity"
      - tmp_field: "매트릭스[]"
        from:      "test_matrix"
    hitl: false
  - id:           "step-02"
    name:         "시험 실행(기능·완화·취약점·침투)"
    section_ref:  "§5.2.1-5.2.4"
    inputs:
      - field:    "test_results"
        type:     "table"
        question: "각 시험 유형의 결과를 기재하세요."
        columns:  ["시험 유형", "케이스 수", "통과", "발견(고/중/저)", "보고서 참조"]
        required: true
    outputs:
      - tmp_field: "결과[]"
        from:      "test_results"
    hitl: false
  - id:           "step-03"
    name:         "발견 처리·연계"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "findings"
        type:     "table"
        question: "발견 사항의 문제해결 연계·종결 상태를 기재하세요."
        columns:  ["발견", "심각도", "PRO-01-05 연계 ID", "종결 여부"]
        required: false
    derivations:
      - id:       "open_high_count"
        expr:     "종결되지 않은 고위험 발견 수"
        description: "릴리스 차단 게이트(0이어야 함)"
    outputs:
      - tmp_field: "발견처리[]"
        from:      "findings"
    hitl: false
  - id:           "step-04"
    name:         "검토 승인"
    section_ref:  "§5.2.6"
    inputs:
      - field:    "approval"
        type:     "enum"
        question: "독립 검토자 검토 결과는?"
        options:  ["승인", "보완요청"]
        required: true
    outputs:
      - tmp_field: "결재.승인"
        from:      "approval"
    hitl: required
    approver_role: "검토자(독립)"
    rationale:    "WI §2 승인자 = 독립 검토자, PRO §3 RACI 시스템 시험 A=검토자. 객관성 확보 필수(5.7.5)"

