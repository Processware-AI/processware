    name:         "공개 범위 결정·권고문 작성"
    section_ref:  "§5.2.1-5.2.2"
    inputs:
      - field:    "disclosure_scope"
        type:     "multiselect"
        question: "공개 대상은?"
        options:  ["규제기관", "사용자", "기관 관리자", "연구자"]
        required: true
      - field:    "advisory_content"
        type:     "table"
        question: "권고문 핵심 내용을 기재하세요."
        columns:  ["취약점 기술", "CVSS", "영향 버전", "해결 방안/완화책"]
        required: true
    outputs:
      - tmp_field: "권고문[]"
        from:      "advisory_content"
    hitl: false
  - id:           "step-02"
    name:         "규제 통지·사용자 공개"
    section_ref:  "§5.2.3-5.2.4"
    inputs:
      - field:    "notifications"
        type:     "table"
        question: "통지/공개 실행 내역을 기재하세요."
        columns:  ["대상", "채널", "통지 일자", "증적"]
        required: true
    outputs:
      - tmp_field: "통지[]"
        from:      "notifications"
    hitl: false
  - id:           "step-03"
    name:         "검토·승인"
    section_ref:  "§5.2.5"
    inputs:
      - field:    "approval"
        type:     "enum"
        question: "PSGB 공개 승인 결과는?"
        options:  ["승인", "보류"]
        required: true
    outputs:
      - tmp_field: "결재.승인"
        from:      "approval"
    hitl: required
    approver_role: "보안운영위원회(PSGB)"
    rationale:    "WI §2 승인자 = PSGB, PRO §3 RACI 공개 결정 A=PSGB"

