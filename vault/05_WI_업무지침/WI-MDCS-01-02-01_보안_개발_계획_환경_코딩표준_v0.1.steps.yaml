wi_id:           "WI-MDCS-01-02-01"
title:           "보안 개발 계획 및 환경·코딩표준 수립"
version:         "0.1"
parent_pro:      "PRO-MDCS-01-02"
parent_pol:      "POL-MDCS-01"
related_tmp:
  - "TMP-MDCS-01-02-01-01"
scope_code:      "MDCS"
scope_type:      "project"
standards:       ["IEC 81001-5-1"]

