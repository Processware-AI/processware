        from:      "distribution"
    hitl: false
  - id:           "step-02"
    name:         "사용자 통보"
    section_ref:  "§5.2.3-5.2.4"
    inputs:
      - field:    "notification"
        type:     "table"
        question: "사용자 통보 내역을 기재하세요."
        columns:  ["통보 대상", "통보 채널", "통보 일자", "영향·방법·기한 포함"]
