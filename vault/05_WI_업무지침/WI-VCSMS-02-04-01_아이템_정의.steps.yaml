wi_id:           "WI-VCSMS-02-04-01"
title:           "아이템 정의 (경계·기능·예비 아키텍처·운용환경)"
version:         "0.1"
parent_pro:      "PRO-VCSMS-02-04"
parent_pol:      "POL-VCSMS-02"
related_tmp:
  - "TMP-VCSMS-02-04-01-01"
scope_code:      "VCSMS"
scope_type:      "project"
standards:       ["ISO/SAE 21434"]

extracted_at:    "2026-06-14T00:00:00Z"
extractor:       "wi-tmp-writer"
extractor_model: "claude-opus-4-7"
manual_override: false

steps:
  - id:          "step-01"
    name:        "아이템 경계 식별"
    section_ref: "§5.2.1"
    description: "아이템 포함 범위와 외부 인터페이스 경계 명시"
    inputs:
      - field:    "item_name"
        type:     "text"
        question: "대상 아이템(item)의 명칭은 무엇입니까?"
        required: true
      - field:    "boundary_components"
        type:     "table"
        question: "아이템에 포함되는 컴포넌트/ECU/기능을 입력하세요."
        columns:  ["component", "in_out_scope", "note"]
        required: true
      - field:    "external_interfaces"
        type:     "table"
        question: "경계를 가로지르는 외부 인터페이스를 입력하세요."
        columns:  ["interface", "type", "direction"]
        required: true
    outputs:
      - tmp_field: "아이템정의서.경계.컴포넌트목록"
        from:      "boundary_components"
      - tmp_field: "아이템정의서.경계.외부인터페이스"
        from:      "external_interfaces"
    hitl: false

  - id:          "step-02"
    name:        "기능 식별"
    section_ref: "§5.2.2"
    inputs:
      - field:    "functions"
        type:     "table"
        question: "아이템이 제공하는 사이버보안 관련 기능과 데이터 흐름을 입력하세요."
        columns:  ["function", "input", "output", "data_flow"]
        required: true
    outputs:
      - tmp_field: "아이템정의서.기능목록"
        from:      "functions"
    hitl: false

  - id:          "step-03"
    name:        "예비 아키텍처 식별"
    section_ref: "§5.2.3"
    inputs:
      - field:    "preliminary_architecture"
        type:     "text"
        question: "컴포넌트·인터페이스·신뢰경계를 포함한 예비 아키텍처를 기술하세요."
        required: true
    outputs:
      - tmp_field: "아이템정의서.예비아키텍처"
        from:      "preliminary_architecture"
    hitl: false

  - id:          "step-04"
    name:        "운용환경 정보 기술"
    section_ref: "§5.2.4"
    inputs:
      - field:    "operational_environment"
        type:     "text"
        question: "사이버보안에 영향을 줄 수 있는 운용환경 정보를 기술하세요."
        required: true
      - field:    "assumptions"
        type:     "table"
        question: "운용환경 가정·전제(assumptions)를 입력하세요."
        columns:  ["assumption", "rationale"]
        required: true
    outputs:
      - tmp_field: "아이템정의서.운용환경"
        from:      "operational_environment"
      - tmp_field: "아이템정의서.가정전제"
        from:      "assumptions"
    hitl: false

  - id:          "step-05"
    name:        "완전성 자체 점검"
    section_ref: "§5.2.5"
    inputs:
      - field:    "completeness_check"
        type:     "multiselect"
        question: "누락 없이 기재된 영역을 모두 선택하세요."
        options:  ["경계", "기능", "예비아키텍처", "운용환경", "가정전제"]
        required: true
    derivations:
      - id:       "completeness_ok"
        expr:     |
          if set(completeness_check) == {"경계","기능","예비아키텍처","운용환경","가정전제"}: "OK"
          else: "누락"
        description: "5개 영역 전부 점검 시 OK"
    outputs:
      - tmp_field: "아이템정의서.완전성점검"
        from:      "completeness_ok"
    hitl: false

  - id:          "step-06"
    name:        "검토·승인"
    section_ref: "§5.2.6"
    inputs:
      - field:    "approval_decision"
        type:     "enum"
        question: "CSM 승인 결정은 무엇입니까?"
        options:  ["승인", "조건부승인", "반려"]
        required: true
    outputs:
      - tmp_field: "아이템정의서.결재.승인"
        from:      "approval_decision"
    hitl: required
    approver_role: "Cybersecurity Manager (CSM)"
    rationale:     "WI §2 승인자 = CSM"

dod_checklist:
  - "아이템 경계와 외부 인터페이스 목록 빠짐없이 기재"
  - "사이버보안 관련 기능·데이터 흐름 기술 완료"
  - "예비 아키텍처(컴포넌트·신뢰경계) 기술 완료"
  - "운용환경 정보 및 가정·전제 분리 기재"
  - "완전성 자체 점검 누락 0건"
  - "CSM 승인 기록 확보"

exception_hooks:
  - section: "§7.1"
    name:    "예비 아키텍처 미확정"
    rule:    "미확정 항목은 TBD(가정 명시)로 표기하고, 후속 확정 시 개정·TARA 재수행 필요성 CSM 판단"
  - section: "§7.2"
    name:    "재사용 아이템"
    rule:    "재사용 분석 결과 입력받아 변경분만 갱신, 변경 없는 부분은 '재사용(원본 참조)' 표기"
  - section: "§7.3"
    name:    "경계 모호(다중 아이템 공유)"
    rule:    "공유 인터페이스 별도 절 분리 기술, 책임 아이템 CSM 지정"

triggers:        ["아이템 정의", "경계 식별", "예비 아키텍처", "운용환경", "item definition"]
aliases:         ["item definition", "아이템 경계", "운용환경 기술", "boundary"]
event_triggers:  ["컨셉 단계 착수", "신규 아이템 사이버보안 엔지니어링 개시"]
domains:         ["자동차"]
