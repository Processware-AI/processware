  # --- 5.5.2 SECURITY implementation review ---

  - id: IEC81001-5-1-5.5.2-REQ-001
    clause: "5.5.2"
    clause_title: "SECURITY implementation review"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to ensure that
      implementation reviews are performed for identifying, characterizing and
      feeding into the problem resolution PROCESS all SECURITY-related issues
      associated with the implementation of the secure design including:
      a) identification of SECURITY requirements (see 5.2) that were not adequately
      addressed by the implementation;
      b) identify secure coding standards used and document any parts of the secure
      coding standards that were not followed;
      c) Static Code Analysis (SCA) for source code to determine secure coding
      errors using the secure coding standard for the supported programming
      language, as established in 5.1.3;
      d) review of the implementation and its TRACEABILITY to the SECURITY
      CAPABILITIES defined to support the SECURITY design (see 5.3 and 5.4); and
      e) examination of THREATS and their ability to exploit implementation
      interfaces, TRUST BOUNDARIES and ASSETS (see 5.3 and 5.4).
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security implementation review records"
      - "Static code analysis reports"
      - "Coding standard deviation records"
      - "Traceability to security capabilities"
    tags:
      - implementation_review
      - static_analysis
      - secure_coding
      - traceability
    status: active
    notes: ""

