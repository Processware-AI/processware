  # --- 5.4.3 Secure HEALTH SOFTWARE interfaces ---

  - id: IEC81001-5-1-5.4.3-REQ-001
    clause: "5.4.3"
    clause_title: "Secure HEALTH SOFTWARE interfaces"
    text: >
      The HEALTH SOFTWARE design shall identify and characterize each interface of
      the HEALTH SOFTWARE including physical and logical interfaces. As appropriate,
      the MANUFACTURER identifies as part of the design:
      a) whether the interface is externally accessible or internally accessible or both;
      b) SECURITY implications of the HEALTH SOFTWARE SECURITY CONTEXT on the
      external interface;
      c) potential users of the interface and the ASSETS that can be accessed through
      the interfaces;
      d) whether the static design includes access to interfaces across TRUST BOUNDARIES;
      e) SECURITY considerations, assumptions and/or constraints associated with
      the use of the interface within the HEALTH SOFTWARE SECURITY CONTEXT;
      f) the SECURITY roles, privileges/rights and access control permissions needed
      to use the interface and to access the ASSETS defined in c);
      g) the SECURITY CAPABILITIES and/or compensating mechanisms used to safeguard
      the interface and the ASSETS identified in c) including run-time VALIDATION
      of inputs as well as handling outputs and errors;
      h) the use of third-party SOFTWARE ITEMS to implement the interface and their
      SECURITY CAPABILITIES;
      i) documentation that describes how to use the interface if it is externally
      accessible; and
      j) description of how the design mitigates the THREATS identified in the
      THREAT MODEL.
    obligation: shall
    type: normative
    classification: evidence_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Interface security characterization document"
      - "Interface security analysis"
      - "Trust boundary analysis for interfaces"
    tags:
      - interface_security
      - trust_boundaries
      - access_control
      - threat_mitigation
    status: active
    notes: ""

  # --- 5.4.4 Detailed design VERIFICATION for SECURITY ---

  - id: IEC81001-5-1-5.4.4-REQ-001
    clause: "5.4.4"
    clause_title: "Detailed design VERIFICATION for SECURITY"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for conducting
      design reviews to identify, characterize and track to closure WEAKNESSES
      associated with each significant revision of the secure design including but
      not limited to:
      a) SECURITY requirements that were not adequately addressed by the design;
      b) THREATS and their ability to exploit VULNERABILITIES in PRODUCT interfaces,
      TRUST BOUNDARIES and ASSETS;
      c) identification, documentation and characterization of detailed design
      best-practices that were not followed (5.3.2 and 5.4.1).
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security design review records"
      - "Design weakness tracking records"
    tags:
      - design_verification
      - design_review
      - weakness_tracking
    status: active
    notes: ""

