  # --- 6.1.1 Timely delivery of SECURITY updates ---

  - id: IEC81001-5-1-6.1.1-REQ-001
    clause: "6.1.1"
    clause_title: "Timely delivery of SECURITY updates"
    text: >
      The MANUFACTURER shall establish – as a part of the update ACTIVITIES – a
      policy that specifies the timeframes for delivering and qualifying SECURITY
      updates to PRODUCT users.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - POL
      - PRO
    evidence_candidates:
      - "Security update delivery policy"
      - "Update timeframe specification"
    tags:
      - maintenance
      - security_updates
      - timeliness
    status: active
    notes: ""

  - id: IEC81001-5-1-6.1.1-REQ-002
    clause: "6.1.1"
    clause_title: "Timely delivery of SECURITY updates"
    text: >
      At a minimum, this policy shall consider the following factors:
      a) the potential impact (technical, for SAFETY, effectiveness, SECURITY) of
      the VULNERABILITY;
      b) public knowledge of the VULNERABILITY;
      c) whether published EXPLOITS exist for the VULNERABILITY;
      d) the volume of deployed PRODUCTS that are affected; and
      e) the AVAILABILITY of an effective external control when no HEALTH SOFTWARE
      update is being provided.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - POL
    evidence_candidates:
      - "Security update policy with impact assessment criteria"
    tags:
      - maintenance
      - security_updates
      - impact_assessment
    status: active
    notes: ""

