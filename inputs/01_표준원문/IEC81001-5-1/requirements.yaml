  # --- 5.8.2 Release documentation ---

  - id: IEC81001-5-1-5.8.2-REQ-001
    clause: "5.8.2"
    clause_title: "Release documentation"
    text: >
      As a part of the software release ACTIVITY (or ACTIVITIES), the MANUFACTURER
      shall establish requirements for ACCOMPANYING DOCUMENTATION:
      a) secure operation guidelines;
      b) PROCESS rigor and conformance documentation including the scoping
      (Clause 4), tailoring (Clause 5) and information on coverage of
      documentation (Annex E);
      c) account management guidelines (if applicable); and
      d) appropriate information about relevant RESIDUAL RISKS to SECURITY
      remaining in the HEALTH SOFTWARE.
    obligation: shall
    type: normative
    classification: evidence_requirement
    safety_class: "N/A"
    target_asset_candidates:
