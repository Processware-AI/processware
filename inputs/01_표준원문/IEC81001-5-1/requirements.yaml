  # --- 4.1.7 Disclosing SECURITY-related issues ---

  - id: IEC81001-5-1-4.1.7-REQ-001
    clause: "4.1.7"
    clause_title: "Disclosing SECURITY-related issues"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for informing
      regulatory authorities and PRODUCT users about VULNERABILITIES (that have been
      identified through ACTIVITIES as specified in 9.5) in supported PRODUCTS in a
      timely manner with content that includes but is not limited to the following
      information:
      a) VULNERABILITY description, VULNERABILITY score as per CVSS or a similar
      system for ranking VULNERABILITIES, and affected PRODUCT version(s); and
      b) description of the resolution.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - TMP
      - REC
    evidence_candidates:
      - "Vulnerability disclosure procedure"
      - "Vulnerability disclosure records"
      - "Security advisory templates"
    tags:
      - vulnerability_disclosure
      - regulatory_notification
      - CVSS
    status: active
    notes: ""

