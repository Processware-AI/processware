  - id: IEC81001-5-1-F.2-REQ-003
    clause: "F.2"
    clause_title: "Development assessment and gap closure activities"
    text: >
      The MANUFACTURER shall perform the following gap closure activities:
      a) documenting system-level SECURITY requirements, as described in 5.2.1;
      b) performing and documenting system-level tests (to the full extent) as
      described in 5.7 software system testing;
      c) assessing and evaluating the SECURITY risk by documenting the SECURITY
      CONTEXT and THREAT MODEL as described in 7.1.1, 7.2 and 7.3;
      d) controlling SECURITY risk as described in 7.4;
      e) creating, or updating existing, secure operation guidelines and account
      management guidelines as described in 5.8.2; and
      f) evaluating the overall residual SECURITY risk and based on this evaluation,
      decide if the TRANSITIONAL HEALTH SOFTWARE is fit for continued use.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
      - PRO
    evidence_candidates:
      - "Gap closure activity records"
      - "System-level security requirements (per 5.2.1)"
      - "System-level security test results (per 5.7)"
      - "Security context and threat model (per 7.1.1, 7.2, 7.3)"
      - "Security risk control records (per 7.4)"
      - "Secure operation guidelines"
      - "Residual risk fitness evaluation"
    tags:
      - transitional_software
      - gap_closure
      - security_testing
      - threat_modelling
      - risk_management
    status: active
    notes: ""

