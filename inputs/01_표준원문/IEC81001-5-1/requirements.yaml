  - id: IEC81001-5-1-5.2.1-REQ-001
    clause: "5.2.1"
    clause_title: "HEALTH SOFTWARE SECURITY requirements"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for ensuring that
      SECURITY requirements are documented for the HEALTH SOFTWARE including
      requirements for SECURITY CAPABILITIES related to installation, operation,
      maintenance and decommissioning.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
