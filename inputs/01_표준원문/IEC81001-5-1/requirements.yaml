  # --- 4.2 SECURITY RISK MANAGEMENT ---

  - id: IEC81001-5-1-4.2-REQ-001
    clause: "4.2"
    clause_title: "SECURITY RISK MANAGEMENT"
    text: >
      The MANUFACTURER shall establish a PROCESS for managing RISKS associated with
      SECURITY. This PROCESS shall use THREAT MODELLING for identifying
      VULNERABILITIES, estimating and evaluating the associated THREATS, controlling
      these THREATS, and monitoring the effectiveness of the RISK CONTROL (SECURITY)
      measures, taking into account the INTENDED USE and the USE ENVIRONMENT of the
      HEALTH SOFTWARE.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - POL
    evidence_candidates:
      - "Security risk management process documentation"
      - "Threat modelling procedure"
    tags:
      - risk_management
      - threat_modelling
    status: active
    notes: ""

  - id: IEC81001-5-1-4.2-REQ-002
    clause: "4.2"
    clause_title: "SECURITY RISK MANAGEMENT"
    text: >
      The MANUFACTURER shall establish the criteria for risk acceptability that
      shall be applied when determining the appropriate way to address each
      VULNERABILITY.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - POL
      - PRO
    evidence_candidates:
      - "Security risk acceptability criteria document"
      - "Risk acceptance policy"
    tags:
      - risk_management
      - risk_acceptability
    status: active
    notes: ""

  - id: IEC81001-5-1-4.2-REQ-003
    clause: "4.2"
    clause_title: "SECURITY RISK MANAGEMENT"
    text: >
      The SECURITY RISK MANAGEMENT should incorporate outcomes of the THREAT
      MODELLING ACTIVITY (or ACTIVITIES) and follow guidelines and industry best
      practice.
    obligation: should
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
    evidence_candidates:
      - "Security risk management process referencing threat model outputs"
    tags:
      - risk_management
      - threat_modelling
      - best_practice
    status: active
    notes: ""

  - id: IEC81001-5-1-4.2-REQ-004
    clause: "4.2"
    clause_title: "SECURITY RISK MANAGEMENT"
    text: >
      The MANUFACTURER shall document any RESIDUAL RISK associated with a
      VULNERABILITY that remains in the system and shall also document respective
      compensating controls applied.
    obligation: shall
    type: normative
    classification: record_requirement
    safety_class: "N/A"
    target_asset_candidates:
