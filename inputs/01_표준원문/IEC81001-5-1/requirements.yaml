  # --- 4.1.4 SECURITY expertise ---

  - id: IEC81001-5-1-4.1.4-REQ-001
    clause: "4.1.4"
    clause_title: "SECURITY expertise"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for identifying
      and providing SECURITY training and assessment programs to ensure that personnel
      assigned to the organizational roles and duties specified in 4.1.2 have
      demonstrated SECURITY expertise appropriate for those PROCESSES. Results of
      this ACTIVITY (or ACTIVITIES) include role descriptions, training profiles and
      training records.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security training program"
      - "Role descriptions with security competency requirements"
      - "Training profiles"
      - "Training records"
    tags:
      - training
      - competence
      - security_expertise
    status: active
    notes: ""

  # --- 4.1.5 SOFTWARE ITEMS from third-party suppliers ---

  - id: IEC81001-5-1-4.1.5-REQ-001
    clause: "4.1.5"
    clause_title: "SOFTWARE ITEMS from third-party suppliers"
    text: >
      The MANUFACTURER shall ensure that third-party suppliers perform applicable
      SECURITY LIFE CYCLE ACTIVITIES for each SOFTWARE ITEM if it meets both of
      the following criteria:
      a) the SOFTWARE ITEM is mainly developed specifically for the MANUFACTURER
      and for a specific purpose; and
      b) the SOFTWARE ITEM can have an impact on SECURITY.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Third-party supplier security activity records"
      - "Supplier qualification records"
      - "Supply chain security agreements"
    tags:
      - third_party
      - supply_chain
      - supplier_management
    status: active
    notes: ""

  - id: IEC81001-5-1-4.1.5-REQ-002
    clause: "4.1.5"
    clause_title: "SOFTWARE ITEMS from third-party suppliers"
    text: >
      The MANUFACTURER shall communicate requirements related to SECURITY for each
      SOFTWARE ITEM specifically developed by a third-party for the MANUFACTURER
      and for a specific purpose.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
      - REF
    evidence_candidates:
      - "Security requirements communicated to suppliers"
      - "Supplier agreements with security clauses"
    tags:
      - third_party
      - supply_chain
      - security_requirements
    status: active
    notes: ""

