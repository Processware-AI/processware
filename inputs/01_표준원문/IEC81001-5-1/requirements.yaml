    status: active
    notes: ""

  # --- 5.2.2 SECURITY requirements review ---

  - id: IEC81001-5-1-5.2.2-REQ-001
    clause: "5.2.2"
    clause_title: "SECURITY requirements review"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for ensuring that
      SECURITY requirements
      a) implement PRODUCT requirements including those relating to RISK CONTROL;
      b) do not contradict one another;
      c) are expressed in terms that avoid ambiguity; and
      d) are stated in terms that permit establishment of test criteria and
      performance of tests.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security requirements review records"
      - "Requirements review checklist"
    tags:
      - security_requirements
      - requirements_review
    status: active
    notes: ""

  - id: IEC81001-5-1-5.2.2-REQ-002
    clause: "5.2.2"
    clause_title: "SECURITY requirements review"
    text: >
      The MANUFACTURER shall document the level of independence of the reviewers.
      Each of the following representative disciplines shall participate in this
      ACTIVITY (or ACTIVITIES):
      a) architects/developers (those who will implement the requirements);
      b) testers (those who will validate that the requirements have been met);
      c) cross-functional experts (can include those with clinical expertise); and
      d) SECURITY advisor(s).
    obligation: shall
    type: normative
    classification: record_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Reviewer independence documentation"
      - "Review participant records by discipline"
    tags:
      - security_requirements
      - reviewer_independence
    status: active
    notes: ""

