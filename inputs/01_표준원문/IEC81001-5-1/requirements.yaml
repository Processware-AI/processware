  - id: IEC81001-5-1-4.1.8-REQ-003
    clause: "4.1.8"
    clause_title: "Periodic review of SECURITY defect management"
    text: >
      Periodic reviews of the SECURITY-related issue management PROCESS shall be
      conducted at least annually or as part of monitoring, measurement and analysis
