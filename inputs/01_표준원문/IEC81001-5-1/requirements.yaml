  # --- 5.8.5 Assessing and addressing SECURITY-related issues ---

  - id: IEC81001-5-1-5.8.5-REQ-001
    clause: "5.8.5"
    clause_title: "Assessing and addressing SECURITY-related issues"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for verifying
      that a HEALTH SOFTWARE or an update is not released until its SECURITY-related
      issues have been addressed and tracked to closure (see 9.5). This includes
      issues associated with:
      a) requirements (see 5.2);
      b) SECURITY by design (see 5.3 and 5.4);
      c) implementation (see 5.5);
      d) VERIFICATION / VALIDATION (see 5.5, 5.6 and 5.7); and
      e) SECURITY defect management (see 9.4).
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
