  # --- 4.1.1 Quality management system ---

  - id: IEC81001-5-1-4.1.1-REQ-001
    clause: "4.1.1"
    clause_title: "Quality management system"
    text: >
      The MANUFACTURER shall perform SECURITY ACTIVITIES in the PRODUCT LIFE CYCLE
      on the basis of an established and documented quality management system.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - POL
      - PRO
    evidence_candidates:
      - "Quality management system documentation"
      - "Security activity records within QMS"
    tags:
      - qms
      - security_lifecycle
    status: active
    notes: ""

