  # ===========================================================================
  # CLAUSE 5 — Software development PROCESS
  # ===========================================================================

  # --- 5.1.1 ACTIVITIES in the LIFE CYCLE PROCESS ---

  - id: IEC81001-5-1-5.1.1-REQ-001
    clause: "5.1.1"
    clause_title: "ACTIVITIES in the LIFE CYCLE PROCESS"
    text: >
      The MANUFACTURER shall establish general LIFE CYCLE ACTIVITIES – from
      conception to decommissioning – that are consistent and integrated with a
      commonly accepted PRODUCT development PROCESS including but not limited to:
      a) CONFIGURATION MANAGEMENT with change controls and change history;
      b) PRODUCT description and requirements definition with requirements TRACEABILITY;
      c) software or hardware design and implementation practices, such as modular design;
      d) repeatable testing VERIFICATION and VALIDATION PROCESS;
      e) review and approval of all development PROCESS records;
      f) PRODUCT support; and
      g) SECURITY updates and patching for HEALTH SOFTWARE.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - POL
    evidence_candidates:
      - "Software development lifecycle plan"
      - "Configuration management plan"
      - "Traceability matrix"
    tags:
      - development_planning
      - lifecycle
      - configuration_management
    status: active
    notes: ""

  - id: IEC81001-5-1-5.1.1-REQ-002
    clause: "5.1.1"
    clause_title: "ACTIVITIES in the LIFE CYCLE PROCESS"
    text: >
      The MANUFACTURER shall document the justification for not implementing
      requirements of this document within a given HEALTH SOFTWARE project based on
      review and approval by personnel with the appropriate SECURITY expertise.
    obligation: shall
    type: normative
    classification: record_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Tailoring justification document"
      - "Approved exemption records"
    tags:
      - tailoring
      - justification
    status: active
    notes: ""

  # --- 5.1.2 Development environment SECURITY ---

  - id: IEC81001-5-1-5.1.2-REQ-001
    clause: "5.1.2"
    clause_title: "Development environment SECURITY"
    text: >
      The MANUFACTURER shall establish risk-based procedural and technical controls
      for protecting the IT infrastructure used for development, production delivery
      and maintenance from unauthorized access, corruption and deletion. This
      includes protecting the HEALTH SOFTWARE during design, implementation, updates,
      testing and release.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - POL
      - PRO
      - WI
    evidence_candidates:
      - "Development environment security policy"
      - "IT infrastructure security controls documentation"
      - "Access control records"
    tags:
      - dev_environment
      - infrastructure_security
      - access_control
    status: active
    notes: ""

