  # --- 5.3.2 Secure design best practices ---

  - id: IEC81001-5-1-5.3.2-REQ-001
    clause: "5.3.2"
    clause_title: "Secure design best practices"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to identify,
      enforce and maintain secure design practices.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - WI
    evidence_candidates:
      - "Secure design practices procedure"
    tags:
      - secure_design
      - best_practices
    status: active
    notes: ""

  - id: IEC81001-5-1-5.3.2-REQ-002
    clause: "5.3.2"
    clause_title: "Secure design best practices"
    text: >
      The MANUFACTURER shall document secure design best practices, which should
      include but are not limited to:
      a) documenting all TRUST BOUNDARIES as part of the design;
      b) least privilege;
      c) using proven secure SOFTWARE ITEMS/designs where possible;
      d) economy of mechanism (striving for simple designs);
      e) using secure design patterns;
      f) ATTACK SURFACE reduction;
      g) removing backdoors, debug access and debug information used during
      development or documenting their presence and the need to protect them
      from unauthorized access; and
      h) protecting any remaining debug information from unauthorized access.
    obligation: shall
    type: normative
    classification: record_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REF
      - WI
    evidence_candidates:
      - "Secure design best practices document"
      - "Design guidelines"
    tags:
