    clause: "6.3.3"
    clause_title: "MAINTAINED SOFTWARE SECURITY update INTEGRITY"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to ensure that
      each applicable update for MAINTAINED SOFTWARE is made available to PRODUCT
      users in a manner that facilitates INTEGRITY VERIFICATION of the SECURITY
      update.
    obligation: shall
