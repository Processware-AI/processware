      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for verifying
      that SECURITY updates created by the MANUFACTURER address the intended
      SECURITY VULNERABILITIES.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
