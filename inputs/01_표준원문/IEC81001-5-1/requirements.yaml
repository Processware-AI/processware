  # --- 5.7.5 Managing conflicts of interest between testers and developers ---

  - id: IEC81001-5-1-5.7.5-REQ-001
    clause: "5.7.5"
    clause_title: "Managing conflicts of interest between testers and developers"
    text: >
      The MANUFACTURER shall document means of ensuring objectivity of the test
      effort for these tests:
      a) ATTACK SURFACE analysis,
      b) SECURITY requirements testing,
      c) THREAT mitigation testing,
      d) VULNERABILITY testing,
      e) known VULNERABILITY scanning and
      f) penetration testing.
    obligation: shall
    type: normative
    classification: record_requirement
    safety_class: "N/A"
