  - id: IEC81001-5-1-4.1.2-REQ-001
    clause: "4.1.2"
    clause_title: "Identification of responsibilities"
    text: >
      The MANUFACTURER shall designate and document the organizational roles and
      personnel responsible for each of the ACTIVITIES and PROCESSES required by
      this document.
    obligation: shall
    type: normative
    classification: role_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
      - POL
    evidence_candidates:
      - "Organizational role assignments"
      - "Responsibility matrix (RACI)"
    tags:
      - roles
      - responsibilities
    status: active
    notes: "Personnel can be identified through functional roles instead of names."

