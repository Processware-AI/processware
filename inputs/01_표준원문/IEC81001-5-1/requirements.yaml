  # ===========================================================================
  # CLAUSE 7 — SECURITY RISK MANAGEMENT PROCESS
  # ===========================================================================

  # --- 7.1.1 General ---

  - id: IEC81001-5-1-7.1.1-REQ-001
    clause: "7.1.1"
    clause_title: "RISK MANAGEMENT context - General"
    text: >
      The MANUFACTURER shall establish and maintain a PROCESS for managing SECURITY
      risks related to HEALTH SOFTWARE as a part of its PRODUCT RISK MANAGEMENT
      approach.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - POL
    evidence_candidates:
      - "Security risk management process documentation"
      - "Risk management plan (security section)"
    tags:
      - risk_management
      - security_risk
    status: active
    notes: ""

  - id: IEC81001-5-1-7.1.1-REQ-002
    clause: "7.1.1"
    clause_title: "RISK MANAGEMENT context - General"
    text: >
      This PROCESS should consist of the following PROCESS steps described in 7.1.2,
      7.2, 7.3, 7.4 and 7.5.
    obligation: should
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
    evidence_candidates:
      - "Security risk management process with defined steps"
    tags:
      - risk_management
    status: active
    notes: ""

  # --- 7.1.2 PRODUCT SECURITY CONTEXT ---

  - id: IEC81001-5-1-7.1.2-REQ-001
    clause: "7.1.2"
    clause_title: "PRODUCT SECURITY CONTEXT"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to ensure that
      the intended PRODUCT SECURITY CONTEXT is documented. This ACTIVITY (or
      ACTIVITIES) is required to ensure that the minimum requirements of the
      environment and the assumptions about that environment are documented in order
      to achieve the SECURITY level for which the PRODUCT was designed.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Product security context document"
      - "Environment assumptions documentation"
    tags:
      - security_context
      - risk_management
      - intended_environment
    status: active
    notes: ""

  # --- 7.2 Identification of VULNERABILITIES, THREATS and associated adverse impacts ---

  - id: IEC81001-5-1-7.2-REQ-001
    clause: "7.2"
    clause_title: "Identification of VULNERABILITIES, THREATS and associated adverse impacts"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) which identifies
      and documents any vulnerabilities, THREATS and associated adverse impacts
      affecting CONFIDENTIALITY, INTEGRITY, AVAILABILITY of ASSETS in HEALTH
      SOFTWARE. This ACTIVITY (or ACTIVITIES) shall consider the INTENDED USE and the
      INTENDED ENVIRONMENT OF USE with respect to the SECURITY CONTEXT.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Vulnerability and threat identification records"
      - "Threat modelling outputs"
    tags:
      - threat_identification
      - vulnerability_identification
      - threat_modelling
    status: active
    notes: ""

  - id: IEC81001-5-1-7.2-REQ-002
    clause: "7.2"
    clause_title: "Identification of VULNERABILITIES, THREATS and associated adverse impacts"
    text: >
      This ACTIVITY (or ACTIVITIES) shall be employed to ensure that all PRODUCTS
      shall have a THREAT MODEL specific to the current development scope of the
      PRODUCT with the following characteristics (where applicable):
      a) correct flow of categorized information throughout the system;
      b) TRUST BOUNDARIES;
      c) PROCESSES;
      d) data stores;
      e) interacting external entities;
      f) internal and external communication protocols implemented in the PRODUCT;
      g) externally accessible physical ports including debug ports;
      h) circuit board connections such as JTAG connections or debug headers which
      might be used to ATTACK the hardware;
      i) potential ATTACK vectors including ATTACK on the (intended) hardware;
      j) potential THREATS;
      k) SECURITY-related issues identified; and
      l) external dependencies in the form of drivers or third-party applications
      that are linked into the application.
    obligation: shall
    type: normative
    classification: evidence_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Threat model document"
      - "Data flow diagrams with trust boundaries"
      - "Attack vector analysis"
    tags:
      - threat_model
      - threat_modelling
      - attack_vectors
    status: active
    notes: ""

  - id: IEC81001-5-1-7.2-REQ-003
    clause: "7.2"
    clause_title: "Identification of VULNERABILITIES, THREATS and associated adverse impacts"
    text: >
      The THREAT MODEL shall be reviewed and verified by the development team to
      ensure that it is correct and understood.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Threat model review records"
      - "Development team sign-off on threat model"
    tags:
      - threat_model
      - review
    status: active
    notes: ""

  - id: IEC81001-5-1-7.2-REQ-004
    clause: "7.2"
    clause_title: "Identification of VULNERABILITIES, THREATS and associated adverse impacts"
    text: >
      The THREAT MODEL shall be reviewed periodically (at least once a year) for
      released PRODUCTS and updated if required in response to the emergence of new
      THREATS to the PRODUCT even if the design does not change.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
      - PRO
    evidence_candidates:
      - "Annual threat model review records"
      - "Threat model update log"
    tags:
      - threat_model
      - periodic_review
      - post_market
    status: active
    notes: ""

  - id: IEC81001-5-1-7.2-REQ-005
    clause: "7.2"
    clause_title: "Identification of VULNERABILITIES, THREATS and associated adverse impacts"
    text: >
      Any issues identified in the THREAT MODEL shall be addressed as defined in
      9.4 and 9.5.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Threat model issue resolution records"
    tags:
      - threat_model
      - problem_resolution
    status: active
    notes: ""

  # --- 7.3 Estimation and evaluation of SECURITY risk ---

  - id: IEC81001-5-1-7.3-REQ-001
    clause: "7.3"
    clause_title: "Estimation and evaluation of SECURITY risk"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to:
      a) estimate the risk of the VULNERABILITIES identified above, considering the
      adverse impact of that VULNERABILITY to CYBERSECURITY. This estimation can
      be supported by using VULNERABILITY scoring, such as CVSS or MITRE scoring
      rubric for medical devices;
      b) evaluate the estimated risks and – based on scoring – determine if the
      risk is acceptable or not; and
      c) inform the PRODUCT RISK MANAGEMENT PROCESS about any updates to the THREAT
      MODEL.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security risk estimation records"
      - "Vulnerability scoring records (e.g. CVSS)"
      - "Risk evaluation and acceptability determination"
    tags:
      - risk_estimation
      - risk_evaluation
      - CVSS
    status: active
    notes: ""

  # --- 7.4 Controlling SECURITY risks ---

  - id: IEC81001-5-1-7.4-REQ-001
    clause: "7.4"
    clause_title: "Controlling SECURITY risks"
    text: >
      The MANUFACTURER shall determine whether SECURITY RISK CONTROL measures are
      appropriate for reducing the SECURITY risks to an acceptable level based on
      SECURITY risk acceptance policies. If RISK CONTROLS are deemed appropriate,
      the MANUFACTURER shall:
      - select appropriate mitigations;
      - determine whether these mitigations result in new risks or increase other risks;
      - implement selected mitigations; and
      - verify the effectiveness of the implemented measures.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security risk control records"
      - "Mitigation selection and implementation records"
      - "Risk control effectiveness verification"
    tags:
      - risk_control
      - mitigation
      - risk_management
    status: active
    notes: ""

  - id: IEC81001-5-1-7.4-REQ-002
    clause: "7.4"
    clause_title: "Controlling SECURITY risks"
    text: >
      The MANUFACTURER shall document the results of these ACTIVITIES.
    obligation: shall
    type: normative
    classification: record_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - REC
    evidence_candidates:
      - "Risk control activity documentation"
    tags:
      - risk_control
      - documentation
    status: active
    notes: ""

  - id: IEC81001-5-1-7.4-REQ-003
    clause: "7.4"
    clause_title: "Controlling SECURITY risks"
    text: >
      Handling of RESIDUAL RISKS to SECURITY shall be done in cooperation with the
      PRODUCT RISK MANAGEMENT.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Residual risk handling records coordinated with product risk management"
    tags:
      - residual_risk
      - risk_management
    status: active
    notes: ""

  # --- 7.5 Monitoring the effectiveness of RISK CONTROLS ---

  - id: IEC81001-5-1-7.5-REQ-001
    clause: "7.5"
    clause_title: "Monitoring the effectiveness of RISK CONTROLS"
    text: >
      The MANUFACTURER shall monitor the effectiveness of RISK CONTROLS by
      information collection and review during the post-release phase.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Post-release risk control monitoring records"
      - "Risk control effectiveness review reports"
    tags:
      - risk_monitoring
      - post_market
      - risk_control
    status: active
    notes: ""

  - id: IEC81001-5-1-7.5-REQ-002
    clause: "7.5"
    clause_title: "Monitoring the effectiveness of RISK CONTROLS"
    text: >
      This ACTIVITY (or ACTIVITIES) shall also inform other ACTIVITIES and PROCESSES
      of the issue or related issue(s), including PROCESSES for other PRODUCTS /
      revisions; and inform third parties (e.g. suppliers) if problems have been
      found in third-party source code to be used with the HEALTH SOFTWARE.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Cross-product issue notification records"
      - "Third-party notification records"
    tags:
      - risk_monitoring
      - third_party_notification
      - cross_product
    status: active
    notes: ""

  # ===========================================================================
  # CLAUSE 8 — Software CONFIGURATION MANAGEMENT PROCESS
  # ===========================================================================

  - id: IEC81001-5-1-8-REQ-001
    clause: "8"
    clause_title: "Software CONFIGURATION MANAGEMENT PROCESS"
    text: >
      The MANUFACTURER shall establish a general PRODUCT development/maintenance/support
      PROCESS that includes CONFIGURATION MANAGEMENT with change controls and change
      history.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - POL
    evidence_candidates:
      - "Configuration management plan"
      - "Change control procedure"
    tags:
      - configuration_management
      - change_control
    status: active
    notes: ""

  - id: IEC81001-5-1-8-REQ-002
    clause: "8"
    clause_title: "Software CONFIGURATION MANAGEMENT PROCESS"
    text: >
      For SECURITY obligations with HEALTH SOFTWARE already released or in the
      market, CONFIGURATION MANAGEMENT shall provide the capability to reproduce a
      list of included external components that are or could become susceptible to
      VULNERABILITIES.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "External component inventory (SBOM)"
      - "Configuration management records for released software"
    tags:
      - configuration_management
      - SBOM
      - external_components
      - vulnerability_tracking
    status: active
    notes: ""

  # ===========================================================================
  # CLAUSE 9 — Software problem resolution PROCESS
  # ===========================================================================

  # --- 9.2 Receiving notifications about VULNERABILITIES ---

  - id: IEC81001-5-1-9.2-REQ-001
    clause: "9.2"
    clause_title: "Receiving notifications about VULNERABILITIES"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) that enables the
      reporting of information regarding VULNERABILITIES to the MANUFACTURER –
      independent of whether they come from an internal entity, an external entity
      or via a complaint-handling system.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - WI
    evidence_candidates:
      - "Vulnerability reporting intake procedure"
      - "Vulnerability reporting channels documentation"
    tags:
      - problem_resolution
      - vulnerability_reporting
    status: active
    notes: ""

  - id: IEC81001-5-1-9.2-REQ-002
    clause: "9.2"
    clause_title: "Receiving notifications about VULNERABILITIES"
    text: >
      This reception ACTIVITY (or ACTIVITIES) shall receive and track to closure
      reports on SECURITY-related issues in the HEALTH SOFTWARE from the following
      sources including at a minimum:
      a) SECURITY VERIFICATION and VALIDATION testers;
      b) suppliers of third-party components used in the PRODUCT;
      c) PRODUCT developers and testers;
      d) PRODUCT users including integrators, operators, administrators, and
      maintenance personnel;
      e) data obtained from audit event log information;
      f) SECURITY researchers (SECURITY VULNERABILITY reporters), also see
      ISO/IEC 29147; and
      g) data or notifications about widespread VULNERABILITIES that can affect the
      HEALTH SOFTWARE.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Vulnerability tracking system"
      - "Intake records from all specified sources"
      - "Coordinated vulnerability disclosure process"
    tags:
      - problem_resolution
      - vulnerability_tracking
      - coordinated_disclosure
    status: active
    notes: ""

  # --- 9.3 Reviewing VULNERABILITIES ---

  - id: IEC81001-5-1-9.3-REQ-001
    clause: "9.3"
    clause_title: "Reviewing VULNERABILITIES"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) that enables the
      investigation of VULNERABILITIES in a timely manner to determine their:
      a) applicability to the PRODUCT;
      b) verifiability; and
      c) related THREATS.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Vulnerability review records"
      - "Applicability assessment records"
    tags:
      - problem_resolution
      - vulnerability_review
      - timeliness
    status: active
    notes: ""

  # --- 9.4 Analysing VULNERABILITIES ---

  - id: IEC81001-5-1-9.4-REQ-001
    clause: "9.4"
    clause_title: "Analysing VULNERABILITIES"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for analysing
      VULNERABILITIES in the PRODUCT to include:
      a) assessing their impact with respect to:
      1) the technical SECURITY CONTEXT in which they were discovered;
      2) the PRODUCT'S INTENDED ENVIRONMENT OF USE, and
      3) the PRODUCT'S DEFENSE-IN-DEPTH strategy;
      b) impact as defined by a VULNERABILITY scoring system (for example CVSS);
      c) identifying all other PRODUCTS / PRODUCT versions containing the
      SECURITY-related issue (if any);
      d) identifying the root cause of the issue;
      e) identifying related SECURITY issues (that is, in the same PRODUCT); and
      f) impact on PRODUCT SAFETY and effectiveness.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Vulnerability analysis records"
      - "Root cause analysis reports"
      - "Impact assessment records (CVSS)"
      - "Cross-product impact analysis"
    tags:
      - problem_resolution
      - vulnerability_analysis
      - root_cause_analysis
      - CVSS
    status: active
    notes: ""

  # --- 9.5 Addressing SECURITY-related issues ---

  - id: IEC81001-5-1-9.5-REQ-001
    clause: "9.5"
    clause_title: "Addressing SECURITY-related issues"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to address
      SECURITY-related issues and determine whether to disclose them (under 4.1.7)
      based on the results of the impact assessment and the acceptable level of
      RESIDUAL RISK.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security issue resolution records"
      - "Disclosure decision records"
    tags:
      - problem_resolution
      - security_issue_handling
      - disclosure
    status: active
    notes: ""

  - id: IEC81001-5-1-9.5-REQ-002
    clause: "9.5"
    clause_title: "Addressing SECURITY-related issues"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to determine
      whether and how identified SECURITY risks will be handled – via the problem
      resolution PROCESS or through updated specifications regarding the INTENDED
      ENVIRONMENT OF USE.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security risk handling decision records"
    tags:
      - problem_resolution
      - risk_handling
    status: active
    notes: ""

  - id: IEC81001-5-1-9.5-REQ-003
    clause: "9.5"
    clause_title: "Addressing SECURITY-related issues"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to review any
      changes to the design or implementation for impact on SAFETY, SECURITY and
      effectiveness.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Change impact review records (safety, security, effectiveness)"
    tags:
      - problem_resolution
      - change_impact
      - safety_security_balance
    status: active
    notes: ""

  - id: IEC81001-5-1-9.5-REQ-004
    clause: "9.5"
    clause_title: "Addressing SECURITY-related issues"
    text: >
      The MANUFACTURER shall inform other PROCESSES of the issue or related
      issue(s), including PROCESSES for other PRODUCTS / PRODUCT revisions. This can
      be done by submitting problem reports or similar into other PROCESSES.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Cross-process notification records"
      - "Problem reports submitted to other processes"
    tags:
      - problem_resolution
      - cross_product
      - notification
    status: active
    notes: ""

  - id: IEC81001-5-1-9.5-REQ-005
    clause: "9.5"
    clause_title: "Addressing SECURITY-related issues"
    text: >
      The MANUFACTURER shall inform third parties if problems have been found in
      third-party source code to be used with SUPPORTED HEALTH SOFTWARE.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Third-party vulnerability notification records"
    tags:
      - problem_resolution
      - third_party_notification
    status: active
    notes: "In case of open-source software, the publishing platform can be used."

  - id: IEC81001-5-1-9.5-REQ-006
    clause: "9.5"
    clause_title: "Addressing SECURITY-related issues"
    text: >
      This ACTIVITY shall include a periodic review of open SECURITY-related issues
      to ensure that issues are being addressed appropriately. This periodic review
      shall at a minimum occur during each PRODUCT release; see 4.1.6 and 4.1.8.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
