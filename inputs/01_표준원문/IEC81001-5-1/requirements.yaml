    clause: "4.1.8"
    clause_title: "Periodic review of SECURITY defect management"
    text: >
      Periodic reviews of the ACTIVITIES shall, at a minimum, examine
      SECURITY-related issues managed through the PROCESS since the last periodic
      review to determine if the management PROCESS was complete, efficient, and
      led to the resolution of SECURITY-related issues.
    obligation: shall
