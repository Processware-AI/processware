  # --- 5.7.1 SECURITY requirements testing ---

  - id: IEC81001-5-1-5.7.1-REQ-001
    clause: "5.7.1"
    clause_title: "SECURITY requirements testing"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for verifying
      that the HEALTH SOFTWARE SECURITY functions meet the SECURITY requirements and
      that the HEALTH SOFTWARE handles error scenarios and invalid input. Based on
      the INTENDED ENVIRONMENT OF USE, types of testing shall include:
      a) functional testing of SECURITY requirements;
      b) performance and scalability testing;
      c) boundary/edge condition, stress and malformed or unexpected input tests
      with potential SECURITY consequences; and
      d) testing each software service that is used by HEALTH SOFTWARE to achieve
      its intended functionality, in the context of responsibility agreements
      among service providers, MANUFACTURERS and operators.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Security requirements test plan"
      - "Security test reports"
      - "Functional security test results"
    tags:
      - security_testing
      - requirements_testing
      - system_testing
    status: active
    notes: ""

  # --- 5.7.2 THREAT mitigation testing ---

  - id: IEC81001-5-1-5.7.2-REQ-001
    clause: "5.7.2"
    clause_title: "THREAT mitigation testing"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for testing the
      effectiveness of the mitigation for the THREATS identified and assessed in the
      THREAT MODEL. ACTIVITIES shall include:
      a) creating and executing adequate testing for each mitigation implemented to
      address a specific THREAT, in order to ensure that the mitigation works as
      designed;
      b) creating and executing plans for attempting to thwart each mitigation; and
      c) ensuring that the mitigation does not introduce other VULNERABILITIES to
      the design.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Threat mitigation test plan"
      - "Threat mitigation test results"
      - "Mitigation effectiveness evidence"
    tags:
      - threat_mitigation
      - security_testing
    status: active
    notes: ""

  # --- 5.7.3 VULNERABILITY testing ---

  - id: IEC81001-5-1-5.7.3-REQ-001
    clause: "5.7.3"
    clause_title: "VULNERABILITY testing"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for performing
      tests that focus on identifying and characterizing potential SECURITY
      VULNERABILITIES in the HEALTH SOFTWARE. Known VULNERABILITY testing shall be
      based upon, at a minimum, recent contents of an established,
      industry-recognized, public source for known VULNERABILITIES. As appropriate,
      testing shall include:
      a) abuse case for malformed or unexpected input testing focused on uncovering
      SECURITY issues, including manual or automated abuse case testing and
      specialized types of abuse case testing on all external interfaces and
      protocols;
      b) ATTACK SURFACE testing to determine all avenues of ingress and egress to
      and from the system;
      c) closed box known VULNERABILITY scanning focused on detecting known
      VULNERABILITIES;
      d) SOFTWARE COMPOSITION ANALYSIS on all binary executable files including
      embedded firmware, to be used with HEALTH SOFTWARE and delivered by a
      third-party supplier; and
      e) dynamic SECURITY testing that detects flaws not visible under static code
      analysis. This testing shall be applied if such tools are available.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Vulnerability test plan"
      - "Vulnerability scan reports"
      - "Software composition analysis reports"
      - "Dynamic security testing reports"
      - "Abuse case test results"
      - "Attack surface analysis report"
    tags:
      - vulnerability_testing
      - SCA
      - fuzz_testing
      - attack_surface
      - penetration_testing
    status: active
    notes: ""

