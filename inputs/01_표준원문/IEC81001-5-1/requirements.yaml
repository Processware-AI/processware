  - id: IEC81001-5-1-6.2.2-REQ-002
    clause: "6.2.2"
    clause_title: "SECURITY update VERIFICATION"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) for verifying
      that SECURITY updates do not introduce unintended effects to functional or
      quality attributes of HEALTH SOFTWARE. Such SECURITY updates include but are
      not limited to updates created by:
      a) the HEALTH SOFTWARE MANUFACTURER,
      b) suppliers of SOFTWARE ITEMS used in the HEALTH SOFTWARE, and
      c) suppliers of SOFTWARE ITEMS or platforms on which the HEALTH SOFTWARE depends.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - PRO
      - REC
    evidence_candidates:
      - "Regression test records for security updates"
      - "Unintended effects analysis records"
    tags:
      - maintenance
      - security_updates
      - regression_testing
    status: active
    notes: ""

  # --- 6.3.1 SUPPORTED SOFTWARE SECURITY update documentation ---

  - id: IEC81001-5-1-6.3.1-REQ-001
    clause: "6.3.1"
    clause_title: "SUPPORTED SOFTWARE SECURITY update documentation"
    text: >
      The MANUFACTURER shall establish a policy to inform PRODUCT users about
      updates for SUPPORTED SOFTWARE. This information shall include:
      a) stating whether the HEALTH SOFTWARE is compatible with the SUPPORTED
      SOFTWARE SECURITY update; and
      b) for SECURITY updates that are unapproved by the HEALTH SOFTWARE
      MANUFACTURER, the mitigations that can be used instead of applying the
      update.
    obligation: shall
    type: normative
    classification: process_requirement
    safety_class: "N/A"
    target_asset_candidates:
      - POL
      - REC
    evidence_candidates:
      - "Supported software update notification policy"
      - "Compatibility statements for supported software updates"
    tags:
      - maintenance
      - supported_software
      - user_notification
    status: active
    notes: ""

  # --- 6.3.2 MAINTAINED SOFTWARE SECURITY update delivery ---

  - id: IEC81001-5-1-6.3.2-REQ-001
    clause: "6.3.2"
    clause_title: "MAINTAINED SOFTWARE SECURITY update delivery"
    text: >
      The MANUFACTURER shall establish an ACTIVITY (or ACTIVITIES) to ensure that
      SECURITY updates are made available for MAINTAINED SOFTWARE to PRODUCT users.
    obligation: shall
    type: normative
    classification: process_requirement
