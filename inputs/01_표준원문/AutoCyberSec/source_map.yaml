source_map:
- requirement_id: AutoCyberSec-05-RQ-01
  native_id: '[RQ-05-01]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 14
  clause: '05'
  source_text: >-
    The organization shall define a cybersecurity policy that includes: a) acknowledgement of road vehicle
    cybersecurity risks; and b) the executive management's commitment to manage the corresponding cybersecurity
    risks.
  source_text_hash: sha256:6164ff3652f35c31
- requirement_id: AutoCyberSec-05-RQ-02
  native_id: '[RQ-05-02]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 14
  clause: '05'
  source_text: >-
    The organization shall establish and maintain rules and processes to: a) enable the implementation
    of the requirements of this document; and b) support the execution of the corresponding activities.
  source_text_hash: sha256:a7212a40d15c7189
- requirement_id: AutoCyberSec-05-RQ-03
  native_id: '[RQ-05-03]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 15
  clause: '05'
  source_text: >-
    The organization shall assign and communicate the responsibilities and corresponding organizational
    authority to achieve and maintain cybersecurity.
  source_text_hash: sha256:c5bb506815b86c94
- requirement_id: AutoCyberSec-05-RQ-04
  native_id: '[RQ-05-04]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 15
  clause: '05'
  source_text: >-
    The organization shall provide the resources to address cybersecurity.
  source_text_hash: sha256:b08ee47925acb52b
- requirement_id: AutoCyberSec-05-RQ-05
  native_id: '[RQ-05-05]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 15
  clause: '05'
  source_text: >-
    The organization shall identify disciplines related to, or interacting with, cybersecurity and establish
    and maintain communication channels between those disciplines in order to: a) determine if and how
    cybersecurity will be integrated into existing processes; and b) coordinate the exchange of relevant
    information.
  source_text_hash: sha256:a79f8ca3dab8e810
- requirement_id: AutoCyberSec-05-RQ-06
  native_id: '[RQ-05-06]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 15
  clause: '05'
  source_text: >-
    The organization shall foster and maintain a strong cybersecurity culture.
  source_text_hash: sha256:ea1588c71d349989
- requirement_id: AutoCyberSec-05-RQ-07
  native_id: '[RQ-05-07]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 15
  clause: '05'
  source_text: >-
    The organization shall ensure that persons to which cybersecurity roles and responsibilities are assigned
    have the competences and awareness to fulfil these.
  source_text_hash: sha256:1684265cee2b1d27
- requirement_id: AutoCyberSec-05-RQ-08
  native_id: '[RQ-05-08]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 16
  clause: '05'
  source_text: >-
    The organization shall institute and maintain a continuous improvement process.
  source_text_hash: sha256:77a33dd143dadf96
- requirement_id: AutoCyberSec-05-RQ-09
  native_id: '[RQ-05-09]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 16
  clause: '05'
  source_text: >-
    The organization shall define the circumstances under which information sharing related to cybersecurity
    is required, permitted, or prohibited, internal or external to the organization.
  source_text_hash: sha256:c2f436f13d344a98
- requirement_id: AutoCyberSec-05-RC-10
  native_id: '[RC-05-10]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 16
  clause: '05'
  source_text: >-
    The organization should align its information security management of the shared data with other parties
    in accordance with [RQ-05-09].
  source_text_hash: sha256:482efe5b7969ad40
- requirement_id: AutoCyberSec-05-RQ-11
  native_id: '[RQ-05-11]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 16
  clause: '05'
  source_text: >-
    The organization shall institute and maintain a quality management system in accordance with International
    Standards, or equivalent, to support cybersecurity engineering, addressing: a) change management;
    b) documentation management; c) configuration management; and d) requirements management.
  source_text_hash: sha256:3ac3c44a0541760b
- requirement_id: AutoCyberSec-05-RQ-12
  native_id: '[RQ-05-12]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 17
  clause: '05'
  source_text: >-
    The configuration information required for maintaining cybersecurity of a product in the field shall
    remain available until the end of cybersecurity support for the product, in order to enable remedial
    actions.
  source_text_hash: sha256:711abc858643b08e
- requirement_id: AutoCyberSec-05-RC-13
  native_id: '[RC-05-13]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 17
  clause: '05'
  source_text: >-
    A cybersecurity management system for the production processes should be established in order to support
    the activities of Clause 12.
  source_text_hash: sha256:4378e8c6f81dca8b
- requirement_id: AutoCyberSec-05-RQ-14
  native_id: '[RQ-05-14]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 17
  clause: '05'
  source_text: >-
    Tools that can influence the cybersecurity of an item or component shall be managed.
  source_text_hash: sha256:c11101148cf45f08
- requirement_id: AutoCyberSec-05-RC-15
  native_id: '[RC-05-15]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 17
  clause: '05'
  source_text: >-
    An appropriate environment to support remedial actions for cybersecurity incidents (see 13.3) should
    be reproducible until the end of cybersecurity support for the product.
  source_text_hash: sha256:911ab17b34f19eaa
- requirement_id: AutoCyberSec-05-RC-16
  native_id: '[RC-05-16]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 17
  clause: '05'
  source_text: >-
    Work products should be managed in accordance with an information security management system.
  source_text_hash: sha256:3f214338343971f3
- requirement_id: AutoCyberSec-05-RQ-17
  native_id: '[RQ-05-17]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 17
  clause: '05'
  source_text: >-
    A cybersecurity audit shall be performed independently to judge whether the organizational processes
    achieve the objectives of this document.
  source_text_hash: sha256:a57510acea96a849
- requirement_id: AutoCyberSec-06-RQ-01
  native_id: '[RQ-06-01]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 20
  clause: '06'
  source_text: >-
    The responsibilities regarding the project's cybersecurity activities shall be assigned and communicated
    in accordance with [RQ-05-03].
  source_text_hash: sha256:a3e138611f3806a3
- requirement_id: AutoCyberSec-06-RQ-02
  native_id: '[RQ-06-02]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 20
  clause: '06'
  source_text: >-
    In order to decide cybersecurity activities needed for the item or component, the item or component
    shall be analysed to determine: a) whether the item or component is cybersecurity relevant; b) if
    the item or component is cybersecurity relevant, whether the item or component is a new development
    or a reuse; and c) whether tailoring in accordance with 6.4.3 is applied.
  source_text_hash: sha256:bafe569a5ac85cf3
- requirement_id: AutoCyberSec-06-RQ-03
  native_id: '[RQ-06-03]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 20
  clause: '06'
  source_text: >-
    The cybersecurity plan shall include the: a) objective of an activity; b) dependencies on other activities
    or information; c) personnel responsible for performing an activity; d) required resources for performing
    an activity; e) starting point or end point, and the expected duration of an activity; and f) identification
    of the work products to be produced.
  source_text_hash: sha256:419eb4acff624abe
- requirement_id: AutoCyberSec-06-RQ-04
  native_id: '[RQ-06-04]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 20
  clause: '06'
  source_text: >-
    The responsibilities for developing and maintaining the cybersecurity plan, and for tracking the progress
    of the cybersecurity activities against the cybersecurity plan shall be assigned in accordance with
    [RQ-05-03] and [RQ-05-04].
  source_text_hash: sha256:6c755c9354621a61
- requirement_id: AutoCyberSec-06-RQ-05
  native_id: '[RQ-06-05]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 20
  clause: '06'
  source_text: >-
    The cybersecurity plan shall either be: a) referenced in the project plan for the development; or
    b) included in the project plan, such that the cybersecurity activities are distinguishable.
  source_text_hash: sha256:e330574edf9942f6
- requirement_id: AutoCyberSec-06-RQ-06
  native_id: '[RQ-06-06]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    The cybersecurity plan shall specify the activities that are required for cybersecurity during the
    concept and product development phases in accordance with the relevant requirements of Clauses 9,
    10, 11 and 15.
  source_text_hash: sha256:1521501a1138a417
- requirement_id: AutoCyberSec-06-RQ-07
  native_id: '[RQ-06-07]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    The cybersecurity plan shall be updated when a change or a refinement of the activities to be performed
    is identified.
  source_text_hash: sha256:e9ec5c123c98f8f4
- requirement_id: AutoCyberSec-06-PM-08
  native_id: '[PM-06-08]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    For threat scenarios of risk value 1 that are determined from an analysis in accordance with 15.8,
    conformity with 9.5, Clause 10 and Clause 11 may be omitted.
  source_text_hash: sha256:0977693f05bc17ed
- requirement_id: AutoCyberSec-06-RQ-09
  native_id: '[RQ-06-09]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    The work products identified in the cybersecurity plan shall be updated and maintained for accuracy
    until and at the release for post-development.
  source_text_hash: sha256:2984446f73cf292b
- requirement_id: AutoCyberSec-06-RQ-10
  native_id: '[RQ-06-10]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    If cybersecurity activities are distributed, customer and supplier shall each define a cybersecurity
    plan regarding their respective cybersecurity activities and interfaces in accordance with Clause
    7.
  source_text_hash: sha256:35d51f2d11b64ea8
- requirement_id: AutoCyberSec-06-RQ-11
  native_id: '[RQ-06-11]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    The cybersecurity plan shall be subject to configuration management and documentation management,
    in accordance with 5.4.4.
  source_text_hash: sha256:cbebb417e169d1f2
- requirement_id: AutoCyberSec-06-RQ-12
  native_id: '[RQ-06-12]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    The work products identified in the cybersecurity plan shall be subject to configuration management,
    change management, requirements management, and documentation management, in accordance with 5.4.4.
  source_text_hash: sha256:fde8973d0438adc8
- requirement_id: AutoCyberSec-06-PM-13
  native_id: '[PM-06-13]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    A cybersecurity activity may be tailored.
  source_text_hash: sha256:b782808f5f46b2c0
- requirement_id: AutoCyberSec-06-RQ-14
  native_id: '[RQ-06-14]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    If a cybersecurity activity is tailored, then a rationale why the tailoring is adequate and sufficient
    to achieve the relevant objectives of this document shall be provided and reviewed.
  source_text_hash: sha256:ddf9181b2b4fc8c1
- requirement_id: AutoCyberSec-06-RQ-15
  native_id: '[RQ-06-15]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 21
  clause: '06'
  source_text: >-
    A reuse analysis shall be carried out if an item or component has been developed and: a) modifications
    are planned; b) is planned to be reused in another operational environment; or c) is planned to be
    reused without modification and there are relevant changes to the information concerning the item
    or component.
  source_text_hash: sha256:2b1235b7aadbaeec
- requirement_id: AutoCyberSec-06-RQ-16
  native_id: '[RQ-06-16]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 22
  clause: '06'
  source_text: >-
    A reuse analysis of an item or component shall: a) identify the modifications to the item or component
    and the modifications of its operational environment; b) analyse the cybersecurity implications of
    the modifications, including the effects on the validity of cybersecurity claims and previously made
    assumptions; c) identify the affected or missing work products; and d) specify the cybersecurity activities
    necessary to conform with this document in the cybersecurity plan (see 6.4.2).
  source_text_hash: sha256:cc24f05499cf0e84
- requirement_id: AutoCyberSec-06-RQ-17
  native_id: '[RQ-06-17]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 22
  clause: '06'
  source_text: >-
    A reuse analysis of a component shall evaluate whether: a) the component is able to fulfil the allocated
    cybersecurity requirements from the item or component, in which it is to be integrated; and b) the
    existing documentation is sufficient to support the integration into an item, or into another component.
  source_text_hash: sha256:291d59b64e0f689c
- requirement_id: AutoCyberSec-06-RQ-18
  native_id: '[RQ-06-18]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    Assumptions on the intended use and context, including the external interfaces, for a component developed
    out-of-context shall be documented in the corresponding work products.
  source_text_hash: sha256:cf3ad04f84803c69
- requirement_id: AutoCyberSec-06-RQ-19
  native_id: '[RQ-06-19]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    For the development of a component out-of-context, the cybersecurity requirements shall be based on
    the assumptions of [RQ-06-18].
  source_text_hash: sha256:e0153bd2484ea5ed
- requirement_id: AutoCyberSec-06-RQ-20
  native_id: '[RQ-06-20]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    For the integration of a component developed out-of-context, the cybersecurity claims and assumptions
    of [RQ-06-18] shall be validated.
  source_text_hash: sha256:4e0ec134fbad8786
- requirement_id: AutoCyberSec-06-RQ-21
  native_id: '[RQ-06-21]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    When integrating an off-the-shelf component, the cybersecurity-relevant documentation shall be gathered
    and analysed to determine whether: a) allocated cybersecurity requirements can be fulfilled; b) the
    component is suitable for the specific application context of the intended use; and c) existing documentation
    is sufficient to support the cybersecurity activities.
  source_text_hash: sha256:8128eaad4827d309
- requirement_id: AutoCyberSec-06-RQ-22
  native_id: '[RQ-06-22]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    If the existing documentation is insufficient to support the integration of the off-the-shelf component,
    then the cybersecurity activities to conform with this document shall be identified and performed.
  source_text_hash: sha256:10a68fd4e8540b09
- requirement_id: AutoCyberSec-06-RQ-23
  native_id: '[RQ-06-23]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    A cybersecurity case shall be created to provide the argument for the cybersecurity of the item or
    component, supported by work products.
  source_text_hash: sha256:4a115020fdd56959
- requirement_id: AutoCyberSec-06-RQ-24
  native_id: '[RQ-06-24]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 23
  clause: '06'
  source_text: >-
    A decision whether to perform a cybersecurity assessment for an item or component shall be made supported
    by a rationale applying a risk-based approach.
  source_text_hash: sha256:0250ba803b70831e
- requirement_id: AutoCyberSec-06-RQ-25
  native_id: '[RQ-06-25]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 24
  clause: '06'
  source_text: >-
    The rationale of [RQ-06-24] shall be reviewed independently.
  source_text_hash: sha256:8c62dabf70897807
- requirement_id: AutoCyberSec-06-RQ-26
  native_id: '[RQ-06-26]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 24
  clause: '06'
  source_text: >-
    The cybersecurity assessment shall judge the cybersecurity of the item or component.
  source_text_hash: sha256:1a65203baffb4fbc
- requirement_id: AutoCyberSec-06-RQ-27
  native_id: '[RQ-06-27]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 24
  clause: '06'
  source_text: >-
    A person responsible to plan and perform independently a cybersecurity assessment shall be appointed
    in accordance with [RQ-06-01].
  source_text_hash: sha256:d89c9a4bcad0abbf
- requirement_id: AutoCyberSec-06-RQ-28
  native_id: '[RQ-06-28]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 24
  clause: '06'
  source_text: >-
    A person who carries out a cybersecurity assessment shall have: a) access to the relevant information
    and tools; and b) the cooperation of the personnel performing the cybersecurity activities.
  source_text_hash: sha256:d55561980b5cdc3e
- requirement_id: AutoCyberSec-06-PM-29
  native_id: '[PM-06-29]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 24
  clause: '06'
  source_text: >-
    A cybersecurity assessment may be based on a judgement of whether the objectives of this document
    are achieved.
  source_text_hash: sha256:2e8c4c482aeb2de4
- requirement_id: AutoCyberSec-06-RQ-30
  native_id: '[RQ-06-30]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 24
  clause: '06'
  source_text: >-
    The scope of a cybersecurity assessment shall include: a) the cybersecurity plan and all work products
    identified in the cybersecurity plan; b) the treatment of the cybersecurity risks; c) the appropriateness
    and effectiveness of implemented cybersecurity controls and cybersecurity activities performed for
    the project; and d) the rationales, if provided, that demonstrate the achievement of the objectives
    of this document.
  source_text_hash: sha256:0408e75049599f63
- requirement_id: AutoCyberSec-06-RQ-31
  native_id: '[RQ-06-31]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 25
  clause: '06'
  source_text: >-
    A cybersecurity assessment report shall include a recommendation for acceptance, conditional acceptance,
    or rejection of the cybersecurity of the item or component.
  source_text_hash: sha256:4b988116b3ea8771
- requirement_id: AutoCyberSec-06-RQ-32
  native_id: '[RQ-06-32]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 25
  clause: '06'
  source_text: >-
    If a recommendation for conditional acceptance in accordance with [RQ-06-31] is made, then the cybersecurity
    assessment report shall include the conditions for acceptance.
  source_text_hash: sha256:a41b388df9a349ad
- requirement_id: AutoCyberSec-06-RQ-33
  native_id: '[RQ-06-33]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 25
  clause: '06'
  source_text: >-
    The following work products shall be available prior to the release for post-development: a) the cybersecurity
    case [WP-06-02]; b) if applicable, the cybersecurity assessment report [WP-06-03]; and c) the cybersecurity
    requirements for post-development [WP-10-02].
  source_text_hash: sha256:57b939297da982cb
- requirement_id: AutoCyberSec-06-RQ-34
  native_id: '[RQ-06-34]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 25
  clause: '06'
  source_text: >-
    The following conditions shall be fulfilled for the release for post-development of the item or component:
    a) the argument for cybersecurity provided by the cybersecurity case is convincing; b) the cybersecurity
    case is confirmed by the cybersecurity assessment, if applicable; and c) the cybersecurity requirements
    for the post-development phases are accepted.
  source_text_hash: sha256:76efc076101bc297
- requirement_id: AutoCyberSec-07-RQ-01
  native_id: '[RQ-07-01]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 26
  clause: '07'
  source_text: >-
    The capability of a candidate supplier to develop and, if applicable, perform post- development activities
    in accordance with this document shall be evaluated.
  source_text_hash: sha256:082f8a24a1056721
- requirement_id: AutoCyberSec-07-RC-02
  native_id: '[RC-07-02]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 26
  clause: '07'
  source_text: >-
    To support a customer's evaluation of supplier capability, a supplier should provide a record of cybersecurity
    capability.
  source_text_hash: sha256:5a500741d4ce50a5
- requirement_id: AutoCyberSec-07-RQ-03
  native_id: '[RQ-07-03]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 27
  clause: '07'
  source_text: >-
    A request for quotation from a customer to a candidate supplier shall include: a) a formal request
    to conform to this document; b) the expectation that cybersecurity responsibilities will be taken
    on by the supplier in accordance with 7.4.3; and c) the cybersecurity goals and/or set of cybersecurity
    requirements relevant to the item or component for which the supplier is quoting.
  source_text_hash: sha256:276b055b82c2f885
- requirement_id: AutoCyberSec-07-RQ-04
  native_id: '[RQ-07-04]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 27
  clause: '07'
  source_text: >-
    A customer and a supplier shall specify the distributed cybersecurity activities in a cybersecurity
    interface agreement including: a) appointment of customer's and supplier's points of contact regarding
    cybersecurity; b) identification of cybersecurity activities that are to be performed by customer
    and supplier, respectively; c) if applicable, a joint tailoring of cybersecurity activities in accordance
    with 6.4.3; d) the information and the work products to be shared; e) milestones regarding the distributed
    cybersecurity activities; and f) definition of the end of cybersecurity support for the item or component.
  source_text_hash: sha256:34d05c39dd8f3eb4
- requirement_id: AutoCyberSec-07-RC-05
  native_id: '[RC-07-05]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 27
  clause: '07'
  source_text: >-
    The cybersecurity interface agreement should be mutually agreed upon between customer and supplier
    prior to the start of the distributed cybersecurity activities.
  source_text_hash: sha256:210ab9ea804e03bc
- requirement_id: AutoCyberSec-07-RQ-06
  native_id: '[RQ-07-06]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 28
  clause: '07'
  source_text: >-
    If there is an identified vulnerability to be managed in accordance with [RQ-08-07], the customer
    and supplier shall agree on actions and responsibility for those actions.
