    on evaluating the predominant attack vector (cf. CVSS [24] 2.1.1) of the attack path.
  source_text_hash: sha256:1da288e0af3a19aa
- requirement_id: AutoCyberSec-15-RQ-15
  native_id: '[RQ-15-15]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 54
  clause: '15'
  source_text: >-
    For each threat scenario the risk value shall be determined from the impact of the associated damage
    scenarios and the attack feasibility of the associated attack paths.
  source_text_hash: sha256:958917d00c713bc2
- requirement_id: AutoCyberSec-15-RQ-16
  native_id: '[RQ-15-16]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 54
  clause: '15'
  source_text: >-
    The risk value of a threat scenario shall be a value between (and including) 1 and 5, where a value
    of 1 represents minimal risk.
  source_text_hash: sha256:7205e9f4fc148805
- requirement_id: AutoCyberSec-15-RQ-17
  native_id: '[RQ-15-17]'
  source_file: sources/ISO_SAE_21434_2021(en).pdf
  page: 55
  clause: '15'
  source_text: >-
    For each threat scenario, considering its risk values, one or more of the following risk treatment
    option(s) shall be determined: a) avoiding the risk; b) reducing the risk; c) sharing the risk; d)
    retaining the risk.
  source_text_hash: sha256:c39e9ba82fd2e6da
