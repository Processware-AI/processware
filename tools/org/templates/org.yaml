# Processware 조직 루트 설정 — docs/architecture/org-layer.md §2
# 이 파일이 있는 디렉토리가 조직 루트({ORG_ROOT})다. 플랫폼 repo 밖 별도 git repo 로 관리한다.
org_id: {org_id}                      # 소문자·숫자·하이픈 (2~32자). Redmine 접두어·레지스트리 키로 사용
name: "{name}"
created: {created}
platform_version: "{platform_version}"   # 마지막 sync-core 시점의 플랫폼 커밋 (자동 갱신)

# 이 조직이 편입한 영역코드 — vault/00_공통관리/07_표준분류레지스트리.md 참조
scopes: []

# RBAC — 역할 정의는 플랫폼 .claude/rbac/policy.yaml (6 역할), 사용자 배정은 여기 (org-layer 단계 4)
# 판정: python3 -m tools.org rbac check --user <이름> --action <scope.verb> [--target <doc_id>]
rbac:
  enforce: false        # true 로 바꾸면 users 에 없는 사용자는 모든 작업 거부 (운영 전환 시 true)
  users: {}
  # 예:
  #   "홍길동": [auditor]
  #   "박팀장": { roles: [executor, process_owner], aliases: ["박 팀장"], owns_pro: ["PRO-QMS-01"] }
  delegations: []       # 한시 권한 위임 (최대 30일 권장). 만료 후에는 자동 무시
  # 예:
  #   - { from: "박팀장", to: "김대리", roles: [process_owner], until: 2026-12-31, reason: "휴가" }
  # audit_log: .processware/rbac_audit.jsonl   # 기본값. 거부·민감 작업 허용·독립성 판정 로그 (append-only)

# 외부 연동 (단계 6). 프로젝트 이름: lib-{org_id}-{scope} / ws-{org_id}-{slug}
redmine:
  enabled: false
  project_prefix: "{org_id}"
